<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>잠사박물관 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6b7280;--line:#e8e8ec;--plum:#6b3a5b;--plum2:#f3e9f0;--ok:#22a45d;--warn:#f0a020;--bad:#d9534f;--blue:#2f6fed;--side:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
.card a[href]:not(.btn):hover{text-decoration:underline}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f6eef3,#eef2f8);padding:16px}
.lbox{background:#fff;border-radius:20px;box-shadow:0 20px 50px -20px rgba(60,30,50,.35);padding:34px 30px;width:min(400px,100%)}
.lbox h1{font-size:22px;margin:10px 0 4px}.lbox p{color:var(--sub);margin:0 0 20px;font-size:13.5px}
.lbox label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
.lbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px}
.lbox .go{width:100%;margin-top:18px;border:0;border-radius:10px;background:var(--plum);color:#fff;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo img{height:30px}
/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 14px}
.side .site{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;font-weight:700}
.side .site img{height:22px}
.side .q a,.side .q button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:none;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;color:var(--ink)}
.side .q a:hover,.side .q button:hover{background:#f4f4f6}
.side h6{margin:18px 10px 6px;font-size:12px;color:#9aa0a8;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;text-align:left}
.nav button:hover{background:#f4f4f6}
.nav button.on{background:#eef0f4}
.nav .ic{width:22px;text-align:center}
.nav .sub{display:none;padding-left:32px}
.nav .grp.open .sub{display:block}
.nav .sub button{font-weight:500;padding:8px 10px;color:#3d3d42}
.nav .sub button.on{background:none;color:var(--plum);font-weight:700}
.nav .car{margin-left:auto;font-size:11px;color:#9aa0a8;transition:transform .2s}.nav .grp.open .car{transform:rotate(180deg)}
.badge{background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.badge.g{background:#e9ecef;color:#555}
.main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:20px}
.top .r{display:flex;gap:8px;align-items:center}
.btn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.p{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.wrapc{padding:24px 28px 60px}
.notice{background:#fff5d9;border-radius:12px;padding:12px 16px;text-align:center;margin-bottom:22px;font-size:14px}
.notice a{color:#e07b00;font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.card{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 14px;font-size:17px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.sec-t h3{margin:0;font-size:20px}
.onb{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-bottom:18px}
.onb .start{background:linear-gradient(160deg,#fff 40%,#e5f4fb);}
.onb .cols{display:grid;grid-template-columns:repeat(3,1fr)}
.onb .cols>div{padding:0 14px;border-left:1px solid var(--line)}.onb .cols>div:first-child{border-left:0;padding-left:0}
.onb h4{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}.onb small{color:var(--sub)}
.onb ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:13px}
.onb li{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#4b5058}
.ck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--ok)}
.ck.no{background:#e3e5e9;color:#888}
.todo{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.todo .it{display:flex;align-items:center;gap:8px;padding:6px 14px;border-right:1px solid var(--line)}.todo .it:last-child{border:0}
.todo .n{background:#eaf1ff;color:var(--blue);border-radius:999px;padding:1px 9px;font-weight:700;font-size:13px}
.todo .n.hot{background:#ffe9e3;color:#e04a1f}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.chart svg{width:100%;height:220px;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--sub);justify-content:flex-end}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--sub);font-weight:600;text-align:center;padding:9px 6px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:9px 6px;border-bottom:1px solid #f1f1f3}
tr.today td{background:#f3f8ff}
.rcard .row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}.rcard .row span:first-child{color:var(--sub)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.pro{background:#fde8f1;color:#d2378a}.pill.ok{background:#e6f6ec;color:var(--ok)}.pill.w{background:#fff1dc;color:#c27400}.pill.b{background:#ffe6e6;color:var(--bad)}.pill.g{background:#eef0f3;color:#666}
.memo textarea{width:100%;border:0;border-bottom:1px solid #e9dca6;background:transparent;min-height:70px;resize:vertical;padding:8px 0}
.memo{background:#fffbe6}
.avs{display:flex;gap:8px;flex-wrap:wrap}.av{width:42px;height:42px;border-radius:50%;background:#e8e3ea;display:grid;place-items:center;font-weight:800;color:var(--plum)}
/* list pages */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.qitem{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.qitem .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.qitem .h b{font-size:15px}
.qitem dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:10px 0;font-size:13.5px}.qitem dt{color:var(--sub)}
.qitem textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:54px}
.form{display:grid;gap:12px;max-width:760px}
.form label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.erow{display:grid;grid-template-columns:1.2fr 1fr .8fr 1.6fr auto;gap:6px;margin-bottom:6px}
.erow input{padding:7px 9px}
.empty{color:var(--sub);text-align:center;padding:30px}
.bars .b{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.bars .t{height:10px;border-radius:5px;background:#eef0f4;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--plum)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 18px;z-index:99}
.links a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f1f3;text-decoration:none}
.mbtn{display:none}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.onb{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;z-index:20;width:260px;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}.side.open{transform:none}.mbtn{display:inline-block}.wrapc{padding:16px}.top{padding:12px 16px}.onb .cols{grid-template-columns:1fr}.onb .cols>div{border:0;padding:0 0 10px}.erow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<!-- 로그인 -->
<div class="login hide" id="vLogin"><div class="lbox">
  <div class="logo"><img src="/img/logo_mark.png" alt="">한국잠사박물관</div>
  <h1 id="lTitle">관리자 로그인</h1><p id="lDesc">홈페이지 관리자 계정으로 로그인하세요.</p>
  <form id="fLogin">
    <div id="setupOnly" class="hide"><label>설정 코드</label><input id="lCode" autocomplete="off" placeholder="처음 한 번만 필요해요"><label>이름</label><input id="lName" placeholder="예: 대표 이경연"></div>
    <label>아이디</label><input id="lUser" autocomplete="username" required>
    <label>비밀번호</label><input id="lPw" type="password" autocomplete="current-password" required minlength="8">
    <button class="go" type="submit" id="lGo">로그인</button>
    <div class="err" id="lErr"></div>
  </form>
  <p style="margin-top:14px;font-size:12px">← <a href="/">홈페이지로 돌아가기</a></p>
</div></div>

<!-- 관리자 화면 -->
<div class="shell hide" id="vApp">
<aside class="side" id="side">
  <div class="brand"><div class="logo"><img src="/img/logo_mark.png" alt="">관리자</div></div>
  <div class="site"><img src="/img/ch/nue.png" alt="">잠사박물관</div>
  <div class="q">
    <button type="button" data-go="todo">🔔 알림 <span class="badge" id="bAlarm" style="margin-left:auto">0</span></button>
    <a href="/" target="_blank" rel="noopener">🎨 디자인 모드 <small style="margin-left:auto;color:#9aa0a8;font-weight:500">사이트 열기</small></a>
    <a href="/" target="_blank" rel="noopener">🖥 사이트 바로가기</a>
  </div>
  <h6>브랜드 운영</h6>
  <nav class="nav" id="nav"></nav>
</aside>
<div class="main">
  <div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn sm mbtn" id="mOpen">☰</button><h2 id="pTitle">잠사박물관</h2></div>
    <div class="r"><span id="who" style="color:var(--sub);font-size:13px"></span><button class="btn" id="bOut">나가기</button></div></div>
  <div class="wrapc" id="page"></div>
</div>
</div>

<script>
const SB='https://ewxquecxsxsfhyzfaaci.supabase.co',KEY='sb_publishable_G2wWHOhRazQUn2nkNr7ZWg_xasgzW_O';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK=null,ME=null;try{TOK=localStorage.getItem('silk_admin_token')}catch(e){}
async function rpc(fn,args={}){const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||t;if(/unauthorized/.test(m)){logout(true)}throw new Error(m)}return j}
async function cfg(key){const r=await fetch(`${SB}/rest/v1/silk_web_config?key=eq.${key}&select=data,updated_at`,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const j=await r.json();return j&&j[0]?j[0].data:null}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function logout(silent){if(TOK&&!silent)rpc('silk_logout',{p_token:TOK}).catch(()=>{});TOK=null;try{localStorage.removeItem('silk_admin_token')}catch(e){};showLogin()}

/* ---------- 로그인 ---------- */
let SETUP=false;
async function showLogin(){$('#vApp').classList.add('hide');$('#vLogin').classList.remove('hide');
  try{const s=await rpc('silk_status');SETUP=!!(s&&s.needsSetup)}catch(e){$('#lErr').textContent='관리자 서버 준비 중이에요. 잠시 후 다시 열어 주세요.';SETUP=false}
  $('#setupOnly').classList.toggle('hide',!SETUP);$('#lTitle').textContent=SETUP?'처음 관리자 계정 만들기':'관리자 로그인';
  $('#lDesc').textContent=SETUP?'받으신 설정 코드와 함께 사용할 아이디·비밀번호(8자 이상)를 정해 주세요.':'홈페이지 관리자 계정으로 로그인하세요.';$('#lGo').textContent=SETUP?'계정 만들고 시작하기':'로그인'}
$('#fLogin').onsubmit=async e=>{e.preventDefault();$('#lErr').textContent='';try{
  const r=SETUP?await rpc('silk_setup',{p_code:$('#lCode').value.trim(),p_username:$('#lUser').value.trim(),p_password:$('#lPw').value,p_name:$('#lName').value.trim()})
               :await rpc('silk_login',{p_username:$('#lUser').value.trim(),p_password:$('#lPw').value});
  if(r.error)throw new Error(r.error);TOK=r.token;ME=r.user;try{localStorage.setItem('silk_admin_token',TOK)}catch(e){};$('#lPw').value='';start()}catch(err){$('#lErr').textContent=err.message}};
$('#bOut').onclick=()=>logout();
$('#mOpen').onclick=()=>$('#side').classList.toggle('open');

/* ---------- 메뉴 (아임웹 구성) ---------- */
const MENU=[['dash','🏠','대시보드'],
 ['cust','👤','고객',[['quotes','단체 견적·문의'],['todo','처리할 일']]],
 ['shop','🛍','쇼핑',[['tickets','입장권·상품(예매)'],['orders','주문·예약 확인'],['prices','요금표'],['linkset','링크 주소 설정']]],
 ['promo','🎁','프로모션',[['popup','팝업·배너'],['events','행사 소식']]],
 ['content','📝','콘텐츠',[['hours','운영시간·휴관일'],['media','영상·사진 현황']]],
 ['stat','📈','통계',[['visits','방문자'],['inflow','유입 경로·인기 페이지']]],
 ['mkt','📣','홍보·마케팅',[['seo','검색·공유 노출'],['links','외부 채널 바로가기'],['linkset','링크 주소 설정']]],
 ['set','⚙️','설정',[['staff','운영진'],['pw','내 비밀번호'],['audit','활동 기록'],['domain','도메인·배포']]]];
const TITLES=Object.fromEntries(MENU.flatMap(m=>m[3]?m[3]:[[m[0],m[2]]]));
function buildNav(){$('#nav').innerHTML=MENU.map(m=>m[3]?`<div class="grp" data-g="${m[0]}"><button type="button" data-tog="${m[0]}"><span class="ic">${m[1]}</span>${m[2]}${m[0]==='cust'?' <span class="badge" id="bCust">0</span>':''}<span class="car">▾</span></button><div class="sub">${m[3].map(s=>`<button type="button" data-go="${s[0]}">${s[1]}</button>`).join('')}</div></div>`:`<button type="button" data-go="${m[0]}"><span class="ic">${m[1]}</span>${m[2]}</button>`).join('');}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tog]');if(t){t.parentElement.classList.toggle('open');return}const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;$('#side').classList.remove('open')}});
addEventListener('hashchange',route);
function route(){if(!TOK)return;const p=(location.hash||'#dash').slice(1);$$('#nav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===p));
  const grp=MENU.find(m=>m[3]&&m[3].some(s=>s[0]===p));if(grp)$(`.grp[data-g="${grp[0]}"]`)?.classList.add('open');
  $('#pTitle').textContent=p==='dash'?'잠사박물관':TITLES[p]||'잠사박물관';(PAGES[p]||PAGES.dash)()}

/* ---------- 데이터 ---------- */
let DASH=null,QUOTES=null;
async function loadDash(){DASH=await rpc('silk_dashboard',{p_token:TOK});const n=DASH.quotes.new;$('#bAlarm').textContent=n;const bc=$('#bCust');if(bc)bc.textContent=n;return DASH}
const QS={new:['신규','b'],doing:['처리중','w'],done:['완료','ok'],cancel:['취소','g']};
const fmtD=s=>{if(!s)return'-';const d=new Date(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function chartSVG(series){const W=520,H=210,P=28;const max=Math.max(5,...series.map(s=>Math.max(s.pv,s.uv)));const x=i=>P+i*(W-P*2)/(series.length-1||1),y=v=>H-P-(v/max)*(H-P*2);
  const line=(k,c,f)=>{const pts=series.map((s,i)=>`${x(i)},${y(s[k])}`).join(' ');return (f?`<polygon points="${P},${H-P} ${pts} ${x(series.length-1)},${H-P}" fill="${f}"/>`:'')+`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.4"/>`+series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s[k])}" r="3" fill="${c}"><title>${s.day} ${k==='pv'?'페이지뷰':'방문자'} ${s[k]}</title></circle>`).join('')};
  const grid=[0,.25,.5,.75,1].map(t=>`<line x1="${P}" x2="${W-P}" y1="${y(max*t)}" y2="${y(max*t)}" stroke="#eee"/><text x="2" y="${y(max*t)+4}" font-size="10" fill="#999">${Math.round(max*t)}</text>`).join('');
  const lab=series.map((s,i)=>i%2?'':`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#999" text-anchor="middle">${s.day.slice(5).replace('-','/')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 방문자">${grid}${line('pv','#9fd2f5','rgba(159,210,245,.35)')}${line('uv','#2f6fed')}${lab}</svg>`}

/* ---------- 페이지 ---------- */
const PAGES={};
PAGES.dash=async()=>{$('#page').innerHTML='<div class="empty">불러오는 중…</div>';
  let D,site,prices,notices;try{[D,site,notices]=await Promise.all([loadDash(),cfg('site'),cfg('notices')])}catch(e){$('#page').innerHTML=`<div class="card empty">대시보드를 불러오지 못했어요: ${esc(e.message)}</div>`;return}
  const host=location.hostname,dom=/jamsamuseum\.co\.kr$/.test(host);
  const C=(ok,t,go)=>`<li><span>${t}</span>${ok?'<span class="ck">✓</span>':`<button class="btn sm" data-go="${go}">설정 ›</button>`}</li>`;
  const tot=D.series.reduce((a,s)=>a+s.uv,0),pvt=D.series.reduce((a,s)=>a+s.pv,0);

PAGES.prices=async()=>{const S=await siteCfg();const row=(r,i,g)=>`<div class="erow" data-g="${g}">${(g==='tickets'?[['이름',r[0]],['이용 시간',r[1]],['요금',r[2]],['포함 시설',r[3]]]:[['이름',r[0]],['구성',r[1]],['요금',r[2]]]).map(([p,v])=>`<input placeholder="${p}" value="${esc(v)}">`).join('')}${g==='extra'?'<span></span>':''}<button class="btn sm" data-del>삭제</button></div>`;

   <h3 style="margin-top:14px">✋ 추가 체험 (입장권 별도)</h3><div id="pe">${S.extra.map((r,i)=>row(r,i,'extra')).join('')}</div><button class="btn sm" data-add="extra">+ 체험 추가</button>
   <div><label>기준 안내</label><input id="pbase" value="${esc(S.base)}"></div><div><label>하단 안내 문구</label><textarea id="pnote" rows="2">${esc(S.note)}</textarea></div>
   <div><button class="btn p" id="psave">저장하고 홈페이지에 반영</button></div></div>`;
  $('#page').onclick=e=>{if(e.target.matches('[data-del]'))e.target.parentElement.remove();const a=e.target.closest('[data-add]');if(a){const g=a.dataset.add;(g==='tickets'?$('#pt'):$('#pe')).insertAdjacentHTML('beforeend',row(g==='tickets'?['','','','']:['','',''],0,g))}};
  $('#psave').onclick=async()=>{const rd=sel=>$$(sel+' .erow').map(r=>[...r.querySelectorAll('input')].map(i=>i.value.trim())).filter(r=>r[0]);S.tickets=rd('#pt');S.extra=rd('#pe');S.base=$('#pbase').value;S.note=$('#pnote').value;try{await saveSite(S)}catch(e){toast(e.message)}}};
PAGES.hours=async()=>{const S=await siteCfg();const D7=['일','월','화','수','목','금','토'];
  $('#page').innerHTML=`<div class="card form"><h3>운영시간·휴관일</h3><div class="erow" style="grid-template-columns:1fr 1fr 1fr"><div><label>오전</label><input id="h1" value="${esc(S.am)}"></div><div><label>오후</label><input id="h2" value="${esc(S.pm)}"></div><div><label>입장 마감</label><input id="h3" value="${esc(S.last)}"></div></div>
  <div><label>정기 휴관 요일</label><select id="hc">${D7.map((d,i)=>`<option value="${i}"${+S.closed===i?' selected':''}>매주 ${d}요일</option>`).join('')}<option value="-1"${+S.closed===-1?' selected':''}>정기 휴관 없음</option></select></div>
  <div><label>임시 휴관일 (쉼표로 구분, 예: 2026-12-25, 2027-01-01)</label><input id="hx" value="${esc(S.extraClosed||'')}"></div>
  <div><button class="btn p" id="hs">저장하고 홈페이지에 반영</button></div><p style="color:var(--sub);font-size:13px">홈페이지의 '오늘 운영 상태'와 관람시간 안내에 바로 반영돼요.</p></div>`;
  $('#hs').onclick=async()=>{S.am=$('#h1').value;S.pm=$('#h2').value;S.last=$('#h3').value;S.closed=+$('#hc').value;S.closedLabel=S.closed<0?'연중무휴':'매주 '+D7[S.closed]+'요일';S.extraClosed=$('#hx').value;try{await saveSite(S)}catch(e){toast(e.message)}}};

/* 행사 소식 · 팝업 */
PAGES.events=async()=>{const N=(await cfg('notices'))||{items:[]};const draw=()=>{$('#el').innerHTML=N.items.length?N.items.map((x,i)=>`<div class="qitem"><div class="h"><b>${esc(x.title)}</b><span style="color:var(--sub);font-size:12.5px">${esc(x.date)}</span>${x.pin?'<span class="pill pro">고정</span>':''}<span style="margin-left:auto"></span><button class="btn sm" data-ed="${i}">수정</button><button class="btn sm" data-rm="${i}">삭제</button></div><p style="margin:8px 0 0;color:#444;white-space:pre-wrap">${esc(x.body)}</p></div>`).join(''):'<div class="card empty">아직 등록한 행사 소식이 없어요.</div>'};
  $('#page').innerHTML=`<div class="card form" style="margin-bottom:16px"><h3>새 행사 소식</h3><input type="hidden" id="ei" value="-1"><div><label>제목</label><input id="et" placeholder="예: 겨울 눈썰매장 개장"></div><div><label>날짜</label><input id="ed" type="date"></div><div><label>내용</label><textarea id="eb" rows="4"></textarea></div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ep" style="width:auto"> 맨 위에 고정</label><div><button class="btn p" id="es">저장하고 홈페이지에 반영</button></div></div><div id="el"></div>`;draw();
  const save=async()=>{N.items.sort((a,b)=>(b.pin-a.pin)||String(b.date).localeCompare(a.date));try{await rpc('silk_config_save',{p_token:TOK,p_key:'notices',p_data:N});toast('저장했어요')}catch(e){toast(e.message)};draw()};
  $('#es').onclick=()=>{const t=$('#et').value.trim();if(!t){toast('제목을 입력해 주세요');return}const it={title:t,date:$('#ed').value||new Date().toISOString().slice(0,10),body:$('#eb').value,pin:$('#ep').checked};const i=+$('#ei').value;if(i>=0)N.items[i]=it;else N.items.unshift(it);$('#ei').value=-1;['#et','#ed','#eb'].forEach(s=>$(s).value='');$('#ep').checked=false;save()};
  $('#el').onclick=e=>{const r=e.target.closest('[data-rm]');if(r&&confirm('삭제할까요?')){N.items.splice(+r.dataset.rm,1);save()}const d=e.target.closest('[data-ed]');if(d){const x=N.items[+d.dataset.ed];$('#ei').value=d.dataset.ed;$('#et').value=x.title;$('#ed').value=x.date;$('#eb').value=x.body;$('#ep').checked=!!x.pin;scrollTo({top:0,behavior:'smooth'})}}};
PAGES.popup=async()=>{const P=(await cfg('popup'))||{on:false,title:'',body:'',link:'',until:''};
  $('#page').innerHTML=`<div class="card form"><h3>팝업·배너</h3><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="po" style="width:auto"${P.on?' checked':''}> 홈페이지 첫 화면에 팝업 띄우기</label><div><label>제목</label><input id="pt1" value="${esc(P.title)}"></div><div><label>내용</label><textarea id="pb" rows="4">${esc(P.body)}</textarea></div><div><label>버튼 링크 (선택)</label><input id="pl" value="${esc(P.link)}" placeholder="https://"></div><div><label>노출 마감일 (선택)</label><input id="pu" type="date" value="${esc(P.until)}"></div><div><button class="btn p" id="ps">저장하고 홈페이지에 반영</button></div></div>`;
  $('#ps').onclick=async()=>{const d={on:$('#po').checked,title:$('#pt1').value,body:$('#pb').value,link:$('#pl').value,until:$('#pu').value,v:Date.now()};try{await rpc('silk_config_save',{p_token:TOK,p_key:'popup',p_data:d});toast('저장했어요')}catch(e){toast(e.message)}}};
PAGES.media=()=>{$('#page').innerHTML=`<div class="card"><h3>영상·사진 현황</h3><div class="links"><a><span>시설 실물 사진</span><span>159장</span></a><a><span>옛사람 재현 영상 (AI, 15초)</span><span>159편</span></a><a><span>오디 메뉴 실사 영상 (AI)</span><span>6편</span></a><a><span>체험 실사 영상 (AI, 12초)</span><span>17편</span></a><a><span>잠사카툰</span><span>3시리즈 12편</span></a></div><p style="color:var(--sub);font-size:13px;margin-top:12px">AI 영상을 실제 사진·영상으로 바꾸려면 파일을 보내 주세요. 같은 자리에 바로 교체해 드려요.</p></div>`};

/* 통계 */
PAGES.visits=async()=>{const D=await loadDash();const tot=D.series.reduce((a,s)=>a+s.uv,0);
  $('#page').innerHTML=`<div class="card chart" style="margin-bottom:16px"><h3>최근 14일 방문자</h3><div class="legend"><span><i style="background:#9fd2f5"></i>페이지뷰</span><span><i style="background:#2f6fed"></i>방문자</span></div>${chartSVG(D.series)}</div>
  <div class="card"><table><thead><tr><th>일자</th><th>방문자</th><th>페이지뷰</th><th>견적 문의</th></tr></thead><tbody>${D.series.slice().reverse().map((s,i)=>`<tr class="${i?'':'today'}"><td>${s.day}</td><td>${s.uv}</td><td>${s.pv}</td><td>${s.q}</td></tr>`).join('')}</tbody></table>
  <p style="color:var(--sub);font-size:12.5px">휴대폰 ${D.mobile.m||0} · PC ${D.mobile.d||0} (최근 7일 페이지뷰) · 방문자는 브라우저 기준으로 셉니다.</p></div>`};
PAGES.inflow=async()=>{const D=await loadDash();const bar=(L,k)=>{const m=Math.max(1,...L.map(x=>x.n));return L.length?L.map(x=>`<div class="b"><span>${esc(x[k]||'(첫 화면)')}</span><span class="t"><i style="width:${x.n/m*100}%"></i></span><span>${x.n}</span></div>`).join(''):'<div class="empty">아직 데이터가 없어요.</div>'};
  const NM={'#home':'홈','#learn':'방문체험학습','#story':'양잠이야기','#tour':'시설 둘러보기','#online':'온라인 박물관','#group':'단체예약','#visit':'오시는 길','#museum':'박물관'};
  D.paths.forEach(p=>p.path=NM[p.path]||p.path);
  $('#page').innerHTML=`<div class="stats" style="margin-top:0"><div class="card bars"><h3>유입 경로 (최근 7일)</h3>${bar(D.refs,'src')}</div><div class="card bars"><h3>인기 페이지 (최근 7일)</h3>${bar(D.paths,'path')}</div></div>`};

/* 홍보·마케팅 */
PAGES.seo=()=>{const C=[['페이지 제목·설명','홈페이지 제목 "한국잠사박물관"과 소개 문구가 들어가 있어요',true],['카카오톡·네이버 공유 미리보기 이미지','공유 이미지(og:image)를 넣으면 링크 공유 때 사진이 크게 보여요',false],['네이버 서치어드바이저 등록','대표 도메인 연결 후 등록해야 네이버 검색에 새 홈페이지가 나와요',false],['구글 서치 콘솔 등록','대표 도메인 연결 후 등록',false],['모바일 화면','휴대폰 하단 바로가기·큰 영상 보기 적용됨',true]];
  $('#page').innerHTML=`<div class="card"><h3>검색·공유 노출 점검</h3><div class="onb" style="display:block"><ul>${C.map(c=>`<li style="align-items:flex-start"><span><b style="color:#222">${c[0]}</b><br><small>${c[1]}</small></span><span class="ck ${c[2]?'':'no'}">${c[2]?'✓':'·'}</span></li>`).join('')}</ul></div><div class="links" style="margin-top:12px"><a href="https://searchadvisor.naver.com/" target="_blank" rel="noopener"><span>네이버 서치어드바이저</span><span>열기 ↗</span></a><a href="https://search.google.com/search-console" target="_blank" rel="noopener"><span>구글 서치 콘솔</span><span>열기 ↗</span></a></div></div>`};


/* 설정 */
PAGES.staff=async()=>{let L=[];try{L=await rpc('silk_admin_list',{p_token:TOK})}catch(e){}
  $('#page').innerHTML=`<div class="card" style="margin-bottom:16px"><h3>운영진</h3><table><thead><tr><th>이름</th><th>아이디</th><th>권한</th><th>상태</th><th>마지막 로그인</th><th></th></tr></thead><tbody>${L.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${a.role==='owner'?'대표':'직원'}</td><td>${a.active?'<span class="pill ok">사용</span>':'<span class="pill g">중지</span>'}</td><td>${fmtD(a.last)}</td><td>${a.id!==ME?.id&&ME?.role==='owner'?`<button class="btn sm" data-tg="${a.id}" data-r="${a.role}" data-a="${a.active}">${a.active?'사용 중지':'다시 사용'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  ${ME?.role==='owner'?`<div class="card form"><h3>운영진 추가</h3><div class="erow" style="grid-template-columns:1fr 1fr 1fr 1fr"><input id="sn" placeholder="이름"><input id="su" placeholder="아이디"><input id="sp" type="password" placeholder="첫 비밀번호(8자 이상)" autocomplete="new-password"><select id="sr"><option value="staff">직원</option><option value="owner">대표</option></select></div><div><button class="btn p" id="sa">추가</button></div><p style="color:var(--sub);font-size:13px">추가한 직원에게 아이디와 첫 비밀번호를 직접 전해 주고, 로그인 후 '내 비밀번호'에서 바꾸게 해 주세요.</p></div>`:''}`;
  $('#page').onclick=async e=>{const t=e.target.closest('[data-tg]');if(!t)return;try{await rpc('silk_admin_save',{p_token:TOK,p_id:t.dataset.tg,p_username:null,p_password:null,p_name:null,p_role:t.dataset.r,p_active:t.dataset.a!=='true'});PAGES.staff()}catch(err){toast(err.message)}};
  $('#sa')&&($('#sa').onclick=async()=>{try{await rpc('silk_admin_save',{p_token:TOK,p_id:null,p_username:$('#su').value.trim(),p_password:$('#sp').value,p_name:$('#sn').value.trim(),p_role:$('#sr').value,p_active:true});toast('추가했어요');PAGES.staff()}catch(err){toast(err.message)}})};
PAGES.pw=()=>{$('#page').innerHTML=`<div class="card form"><h3>내 비밀번호 바꾸기</h3><div><label>현재 비밀번호</label><input id="w1" type="password" autocomplete="current-password"></div><div><label>새 비밀번호 (8자 이상)</label><input id="w2" type="password" autocomplete="new-password"></div><div><button class="btn p" id="ws">변경</button></div></div>`;
  $('#ws').onclick=async()=>{try{await rpc('silk_change_pw',{p_token:TOK,p_old:$('#w1').value,p_new:$('#w2').value});toast('비밀번호를 바꿨어요');$('#w1').value=$('#w2').value=''}catch(e){toast(e.message)}}};
PAGES.audit=async()=>{let L=[];try{L=await rpc('silk_audit_list',{p_token:TOK})}catch(e){}const A={login:'로그인',login_fail:'로그인 실패',setup:'계정 생성',password:'비밀번호 변경',quote:'문의 처리',config:'설정 변경',admin_save:'운영진 변경'};
  $('#page').innerHTML=`<div class="card"><h3>활동 기록 (최근 200건)</h3><table><thead><tr><th>시간</th><th>관리자</th><th>활동</th><th>내용</th></tr></thead><tbody>${L.map(x=>`<tr><td>${fmtD(x.at)}</td><td>${esc(x.username)}</td><td>${A[x.action]||esc(x.action)}</td><td style="text-align:left">${esc(x.memo||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">기록이 없어요</td></tr>'}</tbody></table></div>`};
PAGES.domain=()=>{const dom=/jamsamuseum\.co\.kr$/.test(location.hostname);$('#page').innerHTML=`<div class="card form"><h3>도메인·배포</h3>
  <div class="links"><a><span>현재 주소</span><span>${esc(location.host)}</span></a><a><span>대표 도메인 jamsamuseum.co.kr</span><span>${dom?'<span class="pill ok">연결됨</span>':'<span class="pill w">연결 전</span>'}</span></a><a href="https://vercel.com/jamsamuseum/jamsa-silk-museum" target="_blank" rel="noopener"><span>배포 관리 (Vercel)</span><span>열기 ↗</span></a></div>
  ${dom?'':`<h3 style="margin-top:10px">연결 순서</h3><ol style="line-height:1.9;color:#333"><li>Vercel → Domains → jamsamuseum.co.kr → DNS Records에 메일 설정 5개 추가 (MX: kr1-aspmx1.worksmobile.com 10, kr1-aspmx2.worksmobile.com 20, aspmx.daum.net 10, alt.aspmx.daum.net 20 · TXT: v=spf1 include:_spf.daum.net ~all)</li><li>가비아 → 네임서버 설정 → ns1.vercel-dns.com / ns2.vercel-dns.com</li><li>몇 십 분 ~ 하루 뒤 자동 적용 (https 자동)</li></ol>`}</div>`};

/* 시작 */
async function start(){$('#vLogin').classList.add('hide');$('#vApp').classList.remove('hide');buildNav();
  try{ME=await rpc('silk_me',{p_token:TOK})}catch(e){return}
  $('#who').textContent=(ME.name||ME.username)+(ME.role==='owner'?' · 대표':' · 직원');route()}
TOK?start():showLogin();
</script>
