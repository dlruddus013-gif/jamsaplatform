// 계정별 개별 기간으로 합산 크롤링
async function multiCrawlWithDates(){
  var accs=(S.config&&S.config.okpos&&S.config.okpos.accounts)||[];
  // 메인 검색기간 (조회기간)
  var searchFrom=($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
  var searchTo=($('dailyDateTo')||{}).value||searchFrom;
  
  // 기본 계정 (유효기간: 2025-05-01~현재)
  var baseValidFrom=(S.config.okpos&&S.config.okpos.dateFrom)||'2025-05-01';
  var baseValidTo=(S.config.okpos&&S.config.okpos.dateTo)||'';
  var accList=[{id:S.config.okpos.id,pw:S.config.okpos.pw,name:'기본(hhbq)',storeCode:S.config.okpos.storeCode,dateFrom:baseValidFrom,dateTo:baseValidTo,_searchFrom:searchFrom,_searchTo:searchTo,enabled:true}];
  
  // 추가 계정 (각자 유효기간 있음)
  accs.forEach(function(a,i){
    if(a.enabled===false)return;
    accList.push({id:a.id,pw:a.pw,name:a.name,storeCode:a.storeCode,
      dateFrom:a.dateFrom||'',dateTo:a.dateTo||'',
      _searchFrom:searchFrom,_searchTo:searchTo,enabled:true});
  });
  
  var summary=accList.map(function(a){
    var period=a.dateFrom?(a.dateFrom+'~'+(a.dateTo||'현재')):'전체';
    return a.name+'('+period+')';
  }).join(', ');
  toast('🔄 합산 크롤링: '+accList.length+'개 계정, 검색기간 '+searchFrom+'~'+searchTo+'\n'+summary,'info');
  await fetch('/api/okpos/multi-crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dateFrom:searchFrom,dateTo:searchTo,accounts:accList,perAccountDates:true})});
}
// 단일 계정 크롤링 (-1이면 기본)
async function crawlSingleAccount(idx){
  var df,dt,accInfo;
  if(idx===-1){
    df=($('okAccDate0From')||{}).value||($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
    dt=($('okAccDate0To')||{}).value||df;
    accInfo='기본('+S.config.okpos.id+')';
    toast('🔄 '+accInfo+' 크롤링: '+df+' ~ '+dt,'info');
    await fetch('/api/sales/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dateFrom:df,dateTo:dt})});
  } else {
    var accs=(S.config&&S.config.okpos&&S.config.okpos.accounts)||[];
    var a=accs[idx];if(!a)return;
    df=($('okAccDate'+(idx+1)+'From')||{}).value||a.dateFrom||($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
    dt=($('okAccDate'+(idx+1)+'To')||{}).value||a.dateTo||df;
    accInfo=a.name+'('+a.id+')';
    toast('🔄 '+accInfo+' 크롤링: '+df+' ~ '+dt,'info');
    await fetch('/api/okpos/multi-crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accounts:[{id:a.id,pw:a.pw,name:a.name,storeCode:a.storeCode,dateFrom:df,dateTo:dt,enabled:true}]})});
  }
}

async function generateDailyExcel(){
  var df=($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
  var dt=($('dailyDateTo')||{}).value||df;
  var sd=S.salesData||{};
  var items=sd.items||[];
  
  // ★ 화면에 표시된 마감일지 데이터를 그대로 수집 (누락 방지)
  var tableData=[];
  var sections=getDailySections();
  var mapped=mapItemsToSections(items,sections);
  
  // 1) 섹션별 정의된 상품 (매핑된 것만이 아니라 전부)
  sections.forEach(function(sec){
    sec.products.forEach(function(p){
      var key=sec.id+'_'+p.name;
      var d=mapped[key]||{qty:0,sales:0};
      var qty=d.qty||0;
      var sales=d.sales||0;
      if(sales===0&&qty>0){
        var pmP=(S.priceMap||{})[p.name]||p.price||0;
        if(pmP>0)sales=pmP*qty;
      }
      if(qty>0||sales>0){
        tableData.push({section:sec.name.replace(/\n/g,' ').trim(),product:p.name,qty:qty,sales:sales,sectionId:sec.id});
      }
    });
  });
  
  // 2) 미매핑 상품 (POS에는 있지만 섹션 정의에 없는 것)
  var unmappedItems=[];
  Object.keys(mapped).filter(function(k){return k.indexOf('unmapped_')===0;}).forEach(function(k){
    var d=mapped[k];
    unmappedItems.push({section:'기타',product:d.product,qty:d.qty,sales:d.sales,sectionId:'etc'});
  });
  tableData=tableData.concat(unmappedItems);
  
  // 3) POS 원본 아이템도 함께 전송 (Python에서 교차검증)
  var rawItems=items.map(function(it){
    return {product:it.product||it.name,qty:it.qty||0,sales:it.total_sales||it.net_sales||0,category:it.category||''};
  });
  
  // 4) 섹션별 소계 (화면에 표시된 그대로)
  var sectionTotals={};
  var totalQty=0,totalSales=0;
  tableData.forEach(function(d){
    var sec=d.section||'기타';
    if(!sectionTotals[sec])sectionTotals[sec]={qty:0,sales:0};
    sectionTotals[sec].qty+=d.qty||0;
    sectionTotals[sec].sales+=d.sales||0;
    totalQty+=d.qty||0;
    totalSales+=d.sales||0;
  });
  
  toast('📥 일일마감 엑셀 생성 중... ('+df+', 매핑 '+tableData.length+'건 + 원본 '+rawItems.length+'건)','info');
  try{
    var r=await fetch('/api/sales/daily-excel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      date:df,dateTo:dt,items:rawItems,tableData:tableData,
      sectionTotals:sectionTotals,totalQty:totalQty,totalSales:totalSales,
      unmappedCount:unmappedItems.length
    })});
    var data=await r.json();
    if(data.ok){
      toast('✅ 엑셀 생성 완료! '+data.matched+'/'+data.total+'건 매칭'+(data.unmatched&&data.unmatched.length>0?' (미매칭 '+data.unmatched.length+'건)':''),'success');
      if(data.unmatched&&data.unmatched.length>0)toast('⚠️ 미매칭: '+data.unmatched.slice(0,5).join(', '),'warning');
      if(data.debug)console.log('[엑셀 매칭 로그]',data.debug.join('\n'));
      window.open('/api/sales/daily-excel/'+df,'_blank');
    }else{
      toast('❌ '+data.error,'error');
    }
  }catch(e){toast('❌ 오류: '+e.message,'error')}
}

// ═══ POS 데이터를 섹션에 매핑 (3단계) ═══
function mapItemsToSections(items,sections){
  var mapped={};
  var usedItems={};
  
  // OKPOS 대분류 → 섹션 힌트
  function catHint(cat){
    if(!cat)return '';
    var c=cat.replace(/\s/g,'');
    if(c.indexOf('누에쉼')>=0||c.indexOf('키오스크1')>=0)return 'rest';
    if(c.indexOf('식당')>=0||c.indexOf('키오스크2')>=0)return 'food';
    if(c.indexOf('먹이')>=0||c.indexOf('키오스크3')>=0)return 'exp';
    if(c.indexOf('매표')>=0||c.indexOf('키오스크4')>=0)return 'rest';
    if(c.indexOf('무료입장')>=0)return 'ticket';
    if(c.indexOf('직영')>=0)return 'ticket';
    return '';
  }
  
  // 상품명→섹션 검색 (category 힌트 우선)
  function findBestSection(item){
    var itemClean=item.product.replace(/\s/g,'');
    var hint=catHint(item.category||'');
    var matches=[];
    
    sections.forEach(function(sec){
      sec.products.forEach(function(p){
        var pClean=p.name.replace(/\s/g,'');
        var aliases=(p.alias||[]).map(function(a){return a.replace(/\s/g,'')});
        var isMatch=(pClean===itemClean||p.name===item.product||aliases.indexOf(itemClean)>=0);
        if(!isMatch&&pClean.length>=4&&(itemClean.indexOf(pClean)>=0||pClean.indexOf(itemClean)>=0))isMatch=true;
        if(isMatch) matches.push({sec:sec,p:p,isHint:sec.id===hint});
      });
    });
    
    if(matches.length===0)return null;
    // category 힌트와 일치하는 것 우선
    var hintMatch=matches.filter(function(m){return m.isHint;});
    return hintMatch.length>0?hintMatch[0]:matches[0];
  }
  
  items.forEach(function(item,idx){
    var best=findBestSection(item);
    if(best){
      var key=best.sec.id+'_'+best.p.name;
      if(!mapped[key])mapped[key]={qty:0,sales:0};
      mapped[key].qty+=item.qty;
      mapped[key].sales+=item.total_sales||item.net_sales||0;
      usedItems[idx]=true;
    }
  });
  
  // 미매핑
  items.forEach(function(item,idx){
    if(usedItems[idx])return;
    mapped['unmapped_'+item.product]={qty:item.qty,sales:item.total_sales||0,product:item.product};
  });
  return mapped;
}

// ═══ CSV 다운로드 공통 ═══
function _downloadCsv(rows,prefix){
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0)s='"'+s.replace(/"/g,'""')+'"';return s}).join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=(prefix||'export_')+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
