<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잠사박물관 통합 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" media="print" onload="this.media='all'" onerror="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Pretendard',-apple-system,sans-serif;background:#080815;color:#e0e0e0;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.card{background:#0e0e20;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #151528}
.btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-family:inherit;transition:all .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
input,select,textarea{width:100%;padding:9px 11px;border-radius:7px;border:1px solid #252540;background:#080815;color:#fff;font-size:12px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#10b981}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 8px;font-size:10px;font-weight:600;color:#555;text-align:left;background:#0e0e20}
td{padding:7px 8px;border-bottom:1px solid #151528}
.badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;display:inline-block}
.dot{padding:2px 5px;border-radius:6px;font-size:8px;font-weight:600}
.toast{position:fixed;top:14px;right:14px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;color:#fff;max-width:380px;display:none;animation:slideIn .3s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes scanLine{0%{top:0}100%{top:calc(100% - 3px)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(16,185,129,.3)}50%{box-shadow:0 0 20px rgba(16,185,129,.6)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pin-btn{width:56px;height:56px;border-radius:12px;border:none;background:#0e0e20;color:#e0e0e0;font-size:22px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pin-btn:hover{background:#1a1a30}
.exp-card{padding:10px 8px;border-radius:10px;border:1px solid #252540;cursor:pointer;text-align:center;position:relative;background:#0e0e20}
.exp-card.sel{border-width:2px}
.slot{padding:12px;border-radius:10px;border:1px solid #252540;cursor:pointer;background:#0e0e20;position:relative;overflow:hidden}
.slot:hover{border-color:#10b981}
.slot.disabled{opacity:.4;cursor:not-allowed}
.rental-cell{padding:5px 4px;text-align:center;border-bottom:1px solid #151528}
</style></head><body>
<div id="hdr" style="background:linear-gradient(135deg,#0f0f22,#141430);border-bottom:1px solid #1a1a30;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
  <div><h1 style="font-size:15px;font-weight:800;background:linear-gradient(135deg,#10b981,#FF6B35);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🎫 잠사박물관 관리자</h1><p style="font-size:9px;color:#555;margin-top:2px">크롤링 → QR스캔 → 사용처리 → OKPOS매출 → 영수증 · <a href="/c" target="_blank" style="color:#10b981;text-decoration:underline">고객용 페이지 →</a></p></div>
  <div style="display:flex;gap:3px;align-items:center"><span id="authBadge"></span><span id="wsB" class="dot" style="background:rgba(239,68,68,.15);color:#ef4444">● 연결중</span><span id="dLa" class="dot"></span><span id="dNv" class="dot"></span><span id="dOk" class="dot"></span><span id="cdT" style="font-family:monospace;font-size:11px;font-weight:700;color:#333;margin-left:3px"></span></div>
</div>
<div id="tabBar" style="display:flex;gap:1px;padding:3px 8px;background:#0a0a18;border-bottom:1px solid #151528;overflow-x:auto"></div>
<div id="content" style="padding:12px;max-width:1100px;margin:0 auto"><div id="_loading" style="padding:60px 20px;text-align:center"><div style="font-size:32px;margin-bottom:12px">⏳</div><div style="color:#888;font-size:14px">로딩 중...</div></div></div>
<div id="_debug" style="position:fixed;bottom:0;left:0;right:0;background:#1a0000;color:#ff6666;font-size:11px;padding:6px 12px;font-family:monospace;z-index:99999;max-height:150px;overflow:auto;display:none"></div>
<div class="toast" id="toast"></div>

<script>
// === 진단 스크립트 (가장 먼저 실행) ===
(function(){
  var d=document.getElementById('_debug');
  var msgs=['[1] 진단 스크립트 실행됨'];
  window._diagLog=function(m){msgs.push(m);if(d)d.innerHTML=msgs.join('<br>')};
  window._diagLog('[2] 브라우저: '+navigator.userAgent.substring(0,80));
  window.onerror=function(msg,url,line,col){
    window._diagLog('[ERROR] '+msg+' (line:'+line+' col:'+col+')');
    return false;
  };
  // IE 감지 → 안내 메시지
  if(navigator.userAgent.indexOf('Trident')!==-1 || navigator.userAgent.indexOf('MSIE')!==-1){
    var c=document.getElementById('content');
    if(c) c.innerHTML='<div style="padding:60px 20px;text-align:center;max-width:500px;margin:0 auto">'
      +'<div style="font-size:64px;margin-bottom:20px">🌐</div>'
      +'<div style="font-size:20px;font-weight:700;color:#ef4444;margin-bottom:12px">Internet Explorer는 지원되지 않습니다</div>'
      +'<div style="font-size:14px;color:#aaa;margin-bottom:24px;line-height:1.6">이 프로그램은 최신 브라우저가 필요합니다.<br>아래 브라우저 중 하나로 접속해주세요.</div>'
      +'<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'
      +'<a href="https://www.google.com/chrome/" target="_blank" style="display:block;padding:14px 28px;background:#1a73e8;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px">Chrome 다운로드</a>'
      +'<a href="https://www.microsoft.com/edge" target="_blank" style="display:block;padding:14px 28px;background:#0078d4;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px">Edge 다운로드</a>'
      +'</div>'
      +'<div style="margin-top:24px;padding:12px;background:#1a1a2e;border-radius:8px;font-size:12px;color:#888">'
      +'주소창에 <b style="color:#10b981">http://localhost:3500</b> 을<br>Edge 또는 Chrome에서 직접 입력해도 됩니다.</div>'
      +'</div>';
    var tb=document.getElementById('tabBar');if(tb)tb.style.display='none';
    var db=document.getElementById('_debug');if(db)db.style.display='none';
  }
})();
</script>

<script>
var ws,S={tickets:[],posLog:[],logs:[],crawlStatus:{la2fdoci:'idle',naver:'idle',okpos:'idle'},sessions:{},isRunning:false,totalCrawls:0,config:{msg:{templates:[]}},experiences:[],expBookings:[],rentals:[],rentalBookings:[],aiDiags:[],aiAlerts:0,msgHistory:[],useHistory:[],priceMap:{},reviews:[],smsLogs:JSON.parse(localStorage.getItem('__sms_logs')||'[]')};
var smsLogViewMode='byCustomer';
var envMode='unknown';
var tab='scan',countdown=0,cdTimer=null;
var _renderTimer=null;
function debouncedRender(){if(_renderTimer)clearTimeout(_renderTimer);_renderTimer=setTimeout(function(){_renderTimer=null;if(tab!=='settings')render();else updateDots();},300);}
var pwCache={la2fdoci:'',naver:'',okpos:''};
var authUser=null,pinInput='';
var selExp='exp1',selExpDate=new Date().toISOString().split('T')[0];
var selRentalType='all',selRentalDate=new Date().toISOString().split('T')[0],rentalViewMode='table',calMonth=new Date().toISOString().slice(0,7);
var verifiedTk=null;
var $=function(id){return document.getElementById(id)};
var _dbg=[];function dbg(m){_dbg.push(new Date().toLocaleTimeString()+' '+m);console.log('[DBG]',m);if(window._diagLog)window._diagLog(m)};
if(window._diagLog)window._diagLog('[3] 메인 스크립트 파싱 시작');
var SRC={la2fdoci:{l:'라투에프도치',c:'#6366f1',bg:'rgba(99,102,241,.08)'},naver:{l:'네이버예약',c:'#03C75A',bg:'rgba(3,199,90,.08)'}};
function fT(d){return d?new Date(d).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-'}
function fD(d){return d?new Date(d).toLocaleDateString('ko-KR')+' '+fT(d):'-'}
function isU(t){return t&&(['사용가능','확정'].indexOf(t.status)>=0)}
function badge(src,sm){var s=SRC[src]||SRC.la2fdoci;return '<span style="padding:'+(sm?'1px 5px':'2px 7px')+';border-radius:5px;font-size:'+(sm?8:10)+'px;font-weight:700;background:'+s.bg+';color:'+s.c+'">'+(sm?(src==='naver'?'NV':'LA'):s.l)+'</span>'}
function stBadge(st){var ok=['사용가능','확정'].indexOf(st)>=0;var split=st==='부분사용';return '<span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:'+(ok?'rgba(16,185,129,.12)':split?'rgba(99,102,241,.12)':'rgba(245,158,11,.12)')+';color:'+(ok?'#10b981':split?'#818cf8':'#f59e0b')+'">'+(st)+'</span>'}
function stC(s){return s==='crawling'?'#818cf8':s==='connected'?'#10b981':s==='error'?'#ef4444':'#555'}
function toast(m,t){var e=$('toast');e.style.cssText='display:block;background:'+({success:'#065f46',error:'#7f1d1d',info:'#1e3a5f',warning:'#713f12'}[t||'success'])+';border:1px solid '+({success:'#10b981',error:'#ef4444',info:'#3b82f6',warning:'#f59e0b'}[t||'success'])+';animation:slideIn .3s';e.textContent=m;setTimeout(function(){e.style.display='none'},3500)}

// ═══ WebSocket ═══
function connectWS(){
  var proto=location.protocol==='https:'?'wss':'ws';
  dbg('WS connecting to '+proto+'://'+location.host);
  ws=new WebSocket(proto+'://'+location.host);
  ws.onopen=function(){dbg('WS CONNECTED');$('wsB').style.cssText='padding:2px 6px;border-radius:6px;font-size:8px;font-weight:600;background:rgba(16,185,129,.15);color:#10b981';$('wsB').innerHTML='🟢 서버연결';toast('서버 연결 성공!','success');loadPriceMap();};
  ws.onclose=function(){dbg('WS CLOSED, reconnecting in 3s');$('wsB').style.cssText='padding:2px 6px;border-radius:6px;font-size:8px;font-weight:600;background:rgba(239,68,68,.15);color:#ef4444';$('wsB').innerHTML='● 재연결중';setTimeout(connectWS,3000)};
  ws.onmessage=function(ev){try{var msg=JSON.parse(ev.data);
    if(msg.type==='state'){S=Object.assign(S,msg.data);debouncedRender()}
    if(msg.type==='log'){S.logs=[{id:Date.now(),time:msg.data.time,c:msg.data.cat,m:msg.data.msg,s:msg.data.status}].concat(S.logs).slice(0,300);if(tab==='logs')debouncedRender()}
    if(msg.type==='crawlStatus'){S.crawlStatus=msg.data;updateDots()}
    if(msg.type==='crawlLive'){
      if(!S._live)S._live={};
      S._live[msg.key]={img:msg.img,step:msg.step,url:msg.url,time:msg.time};
      // 실시간 미리보기 업데이트
      var imgEl=document.getElementById('liveImg_'+msg.key);
      if(imgEl){
        if(msg.img){imgEl.src='data:image/jpeg;base64,'+msg.img;imgEl.style.display='';}
        else{imgEl.style.display='none';}
      }
      // 스크린샷 없으면 텍스트 오버레이 표시
      var ovEl=document.getElementById('liveOv_'+msg.key);
      if(ovEl){
        if(msg.img){ovEl.style.display='none';}
        else{ovEl.style.display='flex';ovEl.innerHTML='<div style="font-size:20px;margin-bottom:6px">🔄</div><div style="font-size:12px;color:#10b981;font-weight:700">'+(msg.step||'진행 중...')+'</div><div style="font-size:9px;color:#666;margin-top:4px">'+(msg.url||'HTTP 모드')+'</div>';}
      }
      var stepEl=document.getElementById('liveStep_'+msg.key);
      if(stepEl)stepEl.textContent=msg.step;
      var urlEl=document.getElementById('liveUrl_'+msg.key);
      if(urlEl)urlEl.textContent=(msg.url||'').substring(0,60);
    }
    if(msg.type==='newTicket'){S.tickets=[msg.data].concat(S.tickets);
      // 최근 크롤링 피드 업데이트
      if(!S._recentCrawled)S._recentCrawled=[];
      S._recentCrawled.unshift(msg.data);
      if(S._recentCrawled.length>30)S._recentCrawled=S._recentCrawled.slice(0,30);
      // 크롤링 탭의 실시간 피드에 추가
      var feedEl=document.getElementById('_crawlFeed');
      if(feedEl){
        var t=msg.data;var src=t.source||'la2fdoci';
        var sc=src==='naver'?'#03C75A':src==='la2fdoci'?'#6366f1':'#FF6B35';
        var row=document.createElement('div');
        row.className='_cfItem';
        row.style.cssText='padding:5px 8px;border-bottom:1px solid #151528;font-size:10px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s';
        row.onmouseenter=function(){this.style.background='#1a1a3a'};
        row.onmouseleave=function(){this.style.background='none'};
        row.setAttribute('data-tk',JSON.stringify({buyer:t.buyer||'',product:t.product||'',phone:t.phone4||'',date:t.date||'',orderNo:t.orderNo||'',status:t.status||'',source:src}));
        row.onclick=function(){var d=JSON.parse(this.getAttribute('data-tk'));alert(d.buyer+' ('+d.phone+')\\n상품: '+d.product+'\\n주문: '+d.orderNo+'\\n날짜: '+d.date+'\\n상태: '+d.status)};
        row.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:'+sc+';flex-shrink:0"></span>'
          +'<span style="color:#ccc;font-weight:600;min-width:50px">'+((t.buyer||'').substring(0,4))+'</span>'
          +'<span style="color:#888;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+((t.product||'').substring(0,20))+'</span>'
          +'<span style="color:'+sc+';font-size:8px;font-weight:700">'+src.substring(0,2).toUpperCase()+'</span>';
        feedEl.insertBefore(row,feedEl.firstChild);
        if(feedEl.children.length>30)feedEl.removeChild(feedEl.lastChild);
        // 건수 업데이트
        var cntEl=document.getElementById('_crawlFeedCnt');
        if(cntEl)cntEl.textContent=S._recentCrawled.length+'건';
      }
      // 탭 배지 업데이트
      var tabBtns=document.querySelectorAll('[data-tab="tickets"]');
      tabBtns.forEach(function(b){var n=b.querySelector('.tab-n');if(n)n.textContent=S.tickets.length});
      if(['scan','tickets'].indexOf(tab)>=0)render()
    }
    if(msg.type==='ticketUpdate'){var d=msg.data;for(var i=0;i<S.tickets.length;i++){if(S.tickets[i].id===d.id||S.tickets[i].orderNo===d.orderNo){S.tickets[i]=Object.assign(S.tickets[i],d);break}};if(['scan','tickets','issue'].indexOf(tab)>=0)render()}
    if(msg.type==='syncVerify'){if(msg.status==='start'){toast('🔄 동기화 검증 중 ('+msg.total+'건)...','info')}else if(msg.status==='done'){S.lastSyncVerify={time:new Date().toISOString(),total:msg.total,confirmed:msg.confirmed,mismatch:msg.mismatch.length,autoFixed:msg.autoFixed,failed:msg.failed,details:msg.mismatch};toast('🔄 검증완료: ✓'+msg.confirmed+(msg.mismatch.length>0?' ⚠'+msg.mismatch.length:'')+(msg.autoFixed>0?' 🔧'+msg.autoFixed:''),msg.mismatch.length>0?'warning':'success');if(tab==='tickets')render()}}
    if(msg.type==='bgComplete'){var bgTk=S.tickets.find(function(t){return String(t.id)===msg.ticketId});if(bgTk){bgTk.adminOk=msg.adminOk;bgTk.okposRegistered=msg.okposOk}toast('🏁 백그라운드 완료: 관리자'+(msg.adminOk?'✓':'△')+' OKPOS'+(msg.okposOk?'✓':'△'),msg.adminOk?'success':'warning');if(['scan','tickets'].indexOf(tab)>=0)render()}
    if(msg.type==='posCompare'){S.lastPosCompare=msg.data;if(!msg.data.match)toast('⚠️ POS↔티켓 불일치! POS:'+msg.data.posTotalQty+'건 / 프로그램:'+msg.data.ticketUsedQty+'건','warning');else toast('✅ POS↔티켓 일치 ('+msg.data.posTotalQty+'건)','success');if(tab==='tickets')render()}
    if(msg.type==='salesData'){S.salesData=msg.data;S.lastSalesCrawl=msg.data.crawled_at;
      // 합산 크롤링 결과 표시
      if(msg.data.multi&&msg.data.accountResults){
        var ar=msg.data.accountResults;
        var summary=ar.map(function(a){return (a.skipped?'⏭':'✅')+' '+a.name+': '+(a.skipped?a.reason:'₩'+(a.total||0).toLocaleString())}).join('\n');
        toast('📊 합산 크롤링 완료 ('+ar.length+'개 계정)\n'+summary,'success');
      }
      if(tab==='pos'||tab==='daily')render()
    }
    if(msg.type==='salesByAccount'){
      S.salesByAccount=msg.data;
      // 계정별 데이터 표시
      var sba=msg.data.accounts||{};
      var accKeys=Object.keys(sba);
      if(accKeys.length>0){
        var el=document.getElementById('_accBreakdown');
        if(el){
          var h2='';
          accKeys.forEach(function(acc){
            var d=sba[acc];
            h2+='<div style="background:#151528;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #FF6B35">';
            h2+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
            h2+='<span style="font-size:12px;font-weight:700;color:#FF6B35">'+acc+'</span>';
            h2+='<span style="font-size:12px;font-weight:800;color:#fbd38d">₩'+d.total.toLocaleString()+'</span></div>';
            h2+='<div style="display:flex;gap:8px;font-size:9px;color:#888">';
            h2+='<span>'+d.qty+'건</span><span>'+d.items.length+'개 상품</span></div>';
            // 상품 목록
            h2+='<div style="margin-top:6px;max-height:120px;overflow-y:auto">';
            (d.items||[]).slice(0,10).forEach(function(it){
              h2+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:9px;border-bottom:1px solid #1a1a30">';
              h2+='<span style="color:#aaa">'+it.product+'</span>';
              h2+='<span style="color:#fff;font-weight:600">₩'+(it.total_sales||0).toLocaleString()+'</span></div>';
            });
            h2+='</div></div>';
          });
          el.innerHTML=h2;
        }
      }
    }
      // 월간 캐시 자동 저장
      var _sd=msg.data;if(_sd&&_sd.dateFrom&&(_sd.grandTotal||_sd.grand_total)){var _gt=_sd.grandTotal||_sd.grand_total;if(!S.monthlyData)S.monthlyData={};S.monthlyData[_sd.dateFrom]={sales:_gt.total_sales||0,qty:_gt.qty||0};}
      toast('📊 매출 업데이트: ₩'+((_sd.grand_total||{}).total_sales||0).toLocaleString(),'success');if(tab==='pos'||tab==='settings')render();if(tab==='daily'&&!_autoAnalysisRunning&&!_oneClickRunning){render();autoDailyAnalysis();}}
    if(msg.type==='timeSalesData'){S.timeSalesData=msg.data;toast('⏰ 시간대별 매출: '+((msg.data.hourly||[]).length)+'개 시간대, ₩'+((msg.data.grand_total||{}).total_sales||0).toLocaleString(),'success');if(tab==='pos'||tab==='posTime')render()}
    if(msg.type==='monthlyProgress'){
      var mp=msg.data;if(!S.monthlyData)S.monthlyData={};
      if(mp.date&&mp.sales!==undefined){S.monthlyData[mp.date]={sales:mp.sales||0,qty:mp.qty||0,items:mp.items||[]};}
      var pBar=$('monthlyProgressBar');
      if(pBar){pBar.style.display='block';pBar.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:6px"><span style="font-size:10px;color:#f97316">📅 '+(mp.date||'')+' ('+(mp.done||0)+'/'+(mp.total||0)+')</span><div style="flex:1;height:4px;background:#1e293b;border-radius:2px"><div style="height:100%;width:'+Math.round((mp.done||0)/(mp.total||1)*100)+'%;background:#f97316;border-radius:2px;transition:width .3s"></div></div>'+(mp.sales>0?'<span style="font-size:10px;color:#FF6B35">₩'+mp.sales.toLocaleString()+'</span>':'')+'</div>';}
      if(tab==='posTime')render();
    }
    if(msg.type==='monthlyData'){
      var md2=msg.data;if(md2.days){if(!S.monthlyData)S.monthlyData={};Object.keys(md2.days).forEach(function(k){S.monthlyData[k]=md2.days[k];});}
      if(md2.done){toast('✅ 월간 크롤링 완료!','success');var pBar2=$('monthlyProgressBar');if(pBar2)pBar2.style.display='none';}
      if(md2.error)toast('❌ 월간 크롤링 오류: '+md2.error,'error');
      if(tab==='posTime')render();
    }
    if(msg.type==='reviewData'){S.reviewData=msg.data;toast('📝 리뷰 '+((msg.data.reviews||[]).length)+'건 수신','success');if($('reviewPanel')&&$('reviewPanel').style.display!=='none')renderReviewPanel();}
    if(msg.type==='processStep'){var el=document.getElementById('bgStatus-'+msg.ticketId);if(el)el.innerHTML='<span style="font-size:9px;color:'+(msg.status==='ok'?'#10b981':msg.status==='warning'?'#f59e0b':'#6366f1')+'">'+msg.label+'</span>'}
    if(msg.type==='expUpdate'){S.experiences=msg.data;if(tab==='experience')render()}
    if(msg.type==='expBookingNew'){S.expBookings=[msg.data].concat(S.expBookings||[]);if(tab==='experience')render()}
    if(msg.type==='rentalBookingNew'){S.rentalBookings=[msg.data].concat(S.rentalBookings||[]);if(tab==='rental')render()}
    if(msg.type==='aiDiag'){S.aiDiags=S.aiDiags||[];S.aiDiags.unshift(msg);if(S.aiDiags.length>20)S.aiDiags.length=20;if(msg.status==='diagnosed')toast('🤖 AI진단: '+(msg.diag?msg.diag.diagnosis:''),'info');if(msg.status==='repaired'){S.aiAlerts=(S.aiAlerts||0)+1;toast('🔧 자동복구 완료','success')};if(tab==='ai')render()}
    if(msg.type==='aiAlert'){S.aiAlerts=(S.aiAlerts||0)+1;toast('🚨 ['+msg.service+'] '+msg.message,'error');render()}
    if(msg.type==='msgSent'){S.msgHistory=S.msgHistory||[];S.msgHistory.unshift(msg.data);if(S.msgHistory.length>200)S.msgHistory.length=200;if(msg.data)logSmsSend(msg.data.phone,msg.data.buyer,msg.data.template,msg.data.ok,msg.data.provider,'','ws');if(tab==='msg')render()}
    if(msg.type==='spotScan'){if(!S.spotScans)S.spotScans={};S.spotScans[msg.data.spotId]=(S.spotScans[msg.data.spotId]||0)+1;if(!S.spotScanLogs)S.spotScanLogs=[];S.spotScanLogs.unshift(msg.data);if(S.spotScanLogs.length>200)S.spotScanLogs.length=200;if(tab==='portal')render()}
    if(msg.type==='spotReset'){S.spotScans={};S.spotScanLogs=[];if(tab==='portal')render()}
    if(msg.type==='reviewUpdate'){S.reviews=S.reviews||[];var idx=S.reviews.findIndex(function(r){return r.id===msg.data.id});if(idx>=0)S.reviews[idx]=msg.data;else S.reviews.push(msg.data);if(tab==='msg')render()}
    if(msg.type==='useLog'){S.useHistory=S.useHistory||[];S.useHistory.unshift(msg.data);if(S.useHistory.length>500)S.useHistory.length=500;if(tab==='useLog')render()}
  }catch(e){}}
}

function api(path,body){return fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}).then(function(r){if(!r.ok)return{ok:false,error:'서버 오류 ('+r.status+')'};return r.json()}).catch(function(e){return{ok:false,error:'네트워크 오류: '+e.message}})}

function updateDots(){
  var ab=$('authBadge');if(ab)ab.innerHTML=authUser?'<span style="padding:2px 8px;border-radius:8px;font-size:9px;font-weight:600;background:rgba(16,185,129,.12);color:#10b981">'+(authUser.role==='admin'?'👑':'👤')+' '+authUser.name+'</span>':'';
  var keys=['la2fdoci','naver','okpos'],ids=['dLa','dNv','dOk'],labels=['라투','NV','POS'];
  for(var i=0;i<3;i++){var el=$(ids[i]);var s=S.crawlStatus[keys[i]]||'idle';var c=stC(s);var conn=S.sessions&&S.sessions[keys[i]];
    el.style.cssText='padding:2px 5px;border-radius:6px;font-size:8px;font-weight:600;background:'+c+'15;color:'+c;
    el.innerHTML=(s==='crawling'?'◌':'●')+' '+labels[i]+(conn?' ✓':'');}
  $('cdT').textContent=S.isRunning?Math.floor(countdown/60)+':'+String(countdown%60).padStart(2,'0'):'';
}

async function saveEdit(){
  if(!editingId)return;
  var r=await api('ticket/edit',{ticketId:editingId,buyer:$('edBuyer').value,phone:$('edPhone').value,product:$('edProduct').value,qty:$('edQty').value,price:$('edPrice').value,status:$('edStatus').value});
  if(r.ok){
    toast('✅ 수정완료: '+(r.changed||[]).join(', '),'success');
    S.tickets=S.tickets.map(function(t){return String(t.id)===String(editingId)?Object.assign(t,r.ticket):t});
    var ov=document.getElementById('editOverlay');if(ov)ov.remove();
    render();
  } else {toast('❌ '+(r.error||'실패'),'error')}
}
async function forceUse(id,name){
  if(!confirm('🔒 '+name+' 을(를) 임의 사용완료 처리합니다.\n\n⚠️ 관리자 페이지에는 반영되지 않습니다.\n(la2fdoci/네이버 페이지는 수동으로 처리 필요)\n\n진행하시겠습니까?'))return;
  try{var r=await api('ticket/force-use',{ticketId:id});
  if(r.ok){toast('🔒 '+name+' 임의 사용완료','success');S.tickets=S.tickets.map(function(t){return String(t.id)===String(id)?Object.assign(t,r.ticket):t});render();}
  else{toast('❌ '+(r.error||'실패'),'error')}}catch(e){toast('❌ 임의처리 오류: '+e.message,'error')}
}
async function deleteTicket(id,name){
  if(!confirm('🗑 '+name+' 티켓을 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.'))return;
  var r=await api('ticket/delete',{ticketId:id});
  if(r.ok){toast('🗑 '+name+' 삭제됨','success');S.tickets=S.tickets.filter(function(t){return String(t.id)!==String(id)});render();}
  else{toast('❌ '+(r.error||'실패'),'error')}
}
async function naverCancelTicket(id,name){
  var reason=prompt('🚫 '+name+' 네이버 예매를 취소하시겠습니까?\n\n• 전액환불 처리됩니다\n• 고객에게 취소 알림이 발송됩니다\n\n취소 사유를 입력하세요:','관리자 취소');
  if(!reason)return;
  toast('🚫 '+name+' 예매취소 중... (네이버 사이트)','info');
  var r=await api('ticket/naver-cancel',{ticketId:id,reason:reason});
  if(r.ok){
    toast('✅ '+name+' 예매취소 완료 (전액환불)','success');
    var tk=S.tickets.find(function(t){return String(t.id)===String(id)});
    if(tk)tk.status='예매취소';
    render();
  }else{
    toast('❌ '+(r.error||'취소 실패'),'error');
  }
}
async function verifyTicket(id,name){
  toast('🔍 '+name+' 사용처리 확인 중...','info');
  var r=await api('ticket/verify',{ticketId:id});
  if(r.ok&&r.result){
    var v=r.result;
    if(v.verified){
      toast('✅ '+name+' 사이트 반영 확인됨: '+v.msg,'success');
    } else if(v.ok){

// ═══ 매출 분석 요약 ═══
function generateSalesSummary(){
  var ts=S.timeSalesData||{};
  var hourly=ts.hourly||[];
  var tgt=ts.grand_total||{};
  if(hourly.length===0) return '';
  
  var totalSales=tgt.total_sales||0;
  var totalQty=tgt.qty||0;
  
  // 피크 시간 (매출 기준)
  var sorted=hourly.slice().sort(function(a,b){return(b.sales||0)-(a.sales||0)});
  var peak=sorted[0]||{};
  var peak2=sorted[1]||{};
  var peak3=sorted[2]||{};
  
  // 평균 매출
  var avgSales=hourly.length>0?Math.round(totalSales/hourly.length):0;
  
  // 피크 비율
  var peakPct=totalSales>0?Math.round((peak.sales||0)/totalSales*100):0;
  
  // 오전/오후 분리
  var amSales=0,pmSales=0,amQty=0,pmQty=0;
  hourly.forEach(function(h){
    var hr=parseInt(h.hour);
    if(hr<12){amSales+=(h.sales||0);amQty+=(h.qty||0);}
    else{pmSales+=(h.sales||0);pmQty+=(h.qty||0);}
  });
  
  // 문자용 요약 (100자 이내)
  var summary='총₩'+totalSales.toLocaleString()+'/'+totalQty+'건'
    +' 피크'+peak.hour+'시(₩'+(peak.sales||0).toLocaleString()+'·'+peakPct+'%)'
    +' 오전₩'+amSales.toLocaleString()+' 오후₩'+pmSales.toLocaleString();
  
  return summary;
}

// ═══ 마감일지 수기 수정 시 합계 자동 재계산 ═══
// ═══ 섹션 카드 호버 상세 ═══
function showSecTip(el,secId){
  var tip=$('secTipBox');if(!tip)return;
  var dataEl=el.querySelector('.sec-detail-data');
  if(!dataEl){tip.style.display='none';return;}
  var color=dataEl.getAttribute('data-color')||'#888';
  var secName=dataEl.getAttribute('data-secname')||'';
  var spans=dataEl.querySelectorAll('span[data-n]');
  var items=[];var totalSales=0;var totalQty=0;
  for(var i=0;i<spans.length;i++){
    var n=spans[i].getAttribute('data-n');
    var q=parseInt(spans[i].getAttribute('data-q'))||0;
    var s=parseInt(spans[i].getAttribute('data-s'))||0;
    items.push({name:n,qty:q,sales:s});
    totalSales+=s;totalQty+=q;
  }
  
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #334155">';
  html+='<span style="font-size:13px;font-weight:700;color:'+color+'">'+secName+'</span>';
  html+='<span style="font-size:11px;font-weight:600;color:#e2e8f0">₩'+totalSales.toLocaleString()+' / '+totalQty+'건</span></div>';
  
  var maxS=items.length>0?items[0].sales:1;
  items.forEach(function(it,idx){
    var pct=maxS>0?Math.round(it.sales/maxS*100):0;
    var rank=idx<3?['🥇','🥈','🥉'][idx]:'';
    html+='<div style="padding:3px 0">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">';
    html+='<span style="font-size:10px;color:#cbd5e1">'+(rank?rank+' ':'')+it.name+'</span>';
    html+='<span style="font-size:10px;color:'+color+';font-weight:600">'+it.qty+'건 ₩'+it.sales.toLocaleString()+'</span></div>';
    html+='<div style="height:2px;background:#0f172a;border-radius:1px"><div style="height:100%;width:'+pct+'%;background:'+color+'40;border-radius:1px"></div></div>';
    html+='</div>';
  });
  if(items.length===0) html+='<div style="color:#64748b;font-size:10px;text-align:center;padding:8px">데이터 없음</div>';
  
  tip.innerHTML=html;
  tip.style.display='block';
  
  var rect=el.getBoundingClientRect();
  var tipW=tip.offsetWidth;var tipH=tip.offsetHeight;
  var left=rect.left+rect.width/2-tipW/2;
  var top=rect.bottom+8;
  if(left<8)left=8;
  if(left+tipW>window.innerWidth-8)left=window.innerWidth-tipW-8;
  if(top+tipH>window.innerHeight-8)top=rect.top-tipH-8;
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hideSecTip(){var tip=$('secTipBox');if(tip)tip.style.display='none';}

function recalcDaily(){
  var table=document.getElementById('dailyTable');
  if(!table)return;
  var rows=table.querySelectorAll('tr');
  // 섹션별 소계 수집
  var secTotals={};
  var grandQty=0,grandSales=0,grandCard=0;
  
  rows.forEach(function(tr){
    var cells=tr.querySelectorAll('td[contenteditable="true"]');
    cells.forEach(function(td){
      var sec=td.getAttribute('data-sec');
      var field=td.getAttribute('data-field');
      if(!sec||!field)return;
      if(!secTotals[sec])secTotals[sec]={qty:0,sales:0,card:0};
      var val=parseInt(td.textContent.replace(/[,\s]/g,''))||0;
      if(field==='qty')secTotals[sec].qty+=val;
      else if(field==='sales')secTotals[sec].sales+=val;
      else if(field==='card')secTotals[sec].card+=val;
    });
  });
  
  // 소계 행 업데이트
  Object.keys(secTotals).forEach(function(sec){
    var st=secTotals[sec];
    var subRow=table.querySelector('tr[data-subtotal="'+sec+'"]');
    if(subRow){
      var sqEl=subRow.querySelector('.sub-qty');if(sqEl)sqEl.textContent=st.qty||'';
      var ssEl=subRow.querySelector('.sub-sales');if(ssEl)ssEl.textContent=st.sales>0?st.sales.toLocaleString():'';
      var scEl=subRow.querySelector('.sub-card');if(scEl)scEl.textContent=st.card>0?st.card.toLocaleString():'';
    }
    grandQty+=st.qty;grandSales+=st.sales;grandCard+=st.card;
  });
  
  // 총계 업데이트
  var gt=document.getElementById('dailyGrandTotal');
  if(gt){
    var gqEl=gt.querySelector('.grand-qty');if(gqEl)gqEl.textContent=grandQty;
    var gsEl=gt.querySelector('.grand-sales');if(gsEl)gsEl.textContent=grandSales.toLocaleString();
    var gcEl=gt.querySelector('.grand-card');if(gcEl)gcEl.textContent=grandCard>0?grandCard.toLocaleString():'';
  }
}

var _autoAnalysisRunning=false;
async function autoDailyAnalysis(){
  if(_autoAnalysisRunning)return;
  _autoAnalysisRunning=true;
  try{
    toast('📊 전주/전년 대비 + AI 분석 자동 실행...','info');
    // 1) 전주 대비
    await compareSales('week');
    // 2) 전년 대비 (전주 결과 아래에 추가)
    await compareSalesAppend('year');
    // 3) AI 분석 (API키 있을 때만)
    await aiDailyAnalysis();
  }catch(e){console.error('autoDailyAnalysis error:',e);}
  _autoAnalysisRunning=false;
}

// 전년 대비 - 기존 비교 결과 아래에 추가
// ═══ 입장객 집계 (매표 카테고리만) ═══
function countTicketQty(items){
  if(!items||!items.length)return 0;
  var sections=getDailySections();
  var ticketNames={};
  sections.forEach(function(sec){
    if(sec.id==='ticket'||sec.id==='ticket2'){
      sec.products.forEach(function(p){
        ticketNames[p.name.replace(/\s/g,'')]=true;
        (p.alias||[]).forEach(function(a){ticketNames[a.replace(/\s/g,'')]=true;});
      });
    }
  });
  var qty=0;
  items.forEach(function(i){
    var clean=(i.product||'').replace(/\s/g,'');
    if(ticketNames[clean])qty+=i.qty||0;
  });
  return qty;
}

async function compareSalesAppend(mode){
  var df=($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
  var dt=($('dailyDateTo')||{}).value||df;
  var d1=new Date(df);
  var compDf,compDt,label;
  if(mode==='week'){
    var w=new Date(d1);w.setDate(w.getDate()-7);compDf=w.toISOString().split('T')[0];
    var w2=new Date(dt);w2.setDate(w2.getDate()-7);compDt=w2.toISOString().split('T')[0];
    label='전주 ('+compDf+')';
  } else {
    var y=new Date(d1);y.setFullYear(y.getFullYear()-1);compDf=y.toISOString().split('T')[0];
    var y2=new Date(dt);y2.setFullYear(y2.getFullYear()-1);compDt=y2.toISOString().split('T')[0];
    label='전년 ('+compDf+')';
  }
  var area=$('dailyCompareArea');
  if(!area)return;
  var existing=area.innerHTML;
  area.innerHTML=existing+'<div class="card" style="padding:12px;text-align:center;margin-top:6px"><span style="color:#888;font-size:11px">📈 '+label+' 비교 크롤링 중...</span></div>';
  
  try{
    var r=await fetch('/api/sales/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentFrom:df,currentTo:dt,compareFrom:compDf,compareTo:compDt})});
    var data=await r.json();
    if(!data.ok){area.innerHTML=existing+'<div class="card" style="padding:8px;color:#888;font-size:10px;margin-top:6px">'+label+' 데이터 없음</div>';return;}
    
    var cur=data.current||{};var comp=data.compare||{};
    var curTotal=cur.total_sales||0,compTotal=comp.total_sales||0;
    var curQty=countTicketQty(cur.items||[]),compQty=countTicketQty(comp.items||[]);
    var diffSales=curTotal-compTotal;var diffQty=curQty-compQty;
    var pctSales=compTotal>0?Math.round((diffSales/compTotal)*100):0;
    var pctQty=compQty>0?Math.round((diffQty/compQty)*100):0;

    html+='<div style="background:#0f172a;border-radius:8px;padding:10px;border:1px solid #334155">';
    html+='<div style="font-size:9px;color:#94a3b8">매출</div>';
    html+='<div style="font-size:18px;font-weight:800;color:'+(upSales?'#10b981':'#ef4444')+'">'+(upSales?'▲':'▼')+' ₩'+Math.abs(diffSales).toLocaleString()+'</div>';
    html+='<div style="font-size:10px;color:'+(upSales?'#10b981':'#ef4444')+'">'+(upSales?'+':'')+pctSales+'% <span style="color:#64748b">('+(mode==='week'?'전주':'전년')+' ₩'+compTotal.toLocaleString()+')</span></div></div>';

var _hourTipEl=null;
function showHourTip(evt,hour){
  if(!_hourTipEl){
    _hourTipEl=document.createElement('div');
    _hourTipEl.style.cssText='position:fixed;z-index:9999;background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:10px;min-width:200px;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;font-size:10px;color:#ccc';
    document.body.appendChild(_hourTipEl);
  }
  var ts=S.timeSalesData||{};
  var byProduct=ts.hourly_by_product||[];
  var items=[];
  byProduct.forEach(function(p){
    if(p.hours&&p.hours[hour]){
      var h=p.hours[hour];
      if(h.qty>0||h.sales>0) items.push({name:p.product,qty:h.qty,sales:h.sales});
    }
  });
  items.sort(function(a,b){return(b.sales||0)-(a.sales||0)});
  var totalS=items.reduce(function(a,i){return a+(i.sales||0)},0);
  var totalQ=items.reduce(function(a,i){return a+(i.qty||0)},0);
  
  var html='<div style="font-weight:700;color:#FF6B35;margin-bottom:6px;font-size:12px">'+hour+'시 상세 ('+items.length+'종)</div>';
  if(items.length===0) html+='<div style="color:#666">데이터 없음</div>';
  else{
    items.slice(0,10).forEach(function(it){
      html+='<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #ffffff08">'
        +'<span>'+it.name+'</span>'
        +'<span style="color:#FF6B35;font-weight:600">₩'+(it.sales||0).toLocaleString()+' ×'+it.qty+'</span></div>';
    });
    if(items.length>10) html+='<div style="color:#666;text-align:center;padding:2px">... 외 '+(items.length-10)+'종</div>';
    html+='<div style="border-top:1px solid #444;margin-top:4px;padding-top:4px;font-weight:700;color:#FF6B35;text-align:right">합계: ₩'+totalS.toLocaleString()+' / '+totalQ+'건</div>';
  }
  _hourTipEl.innerHTML=html;
  _hourTipEl.style.display='block';
  var x=evt.clientX+15,y=evt.clientY-10;
  if(x+310>window.innerWidth)x=evt.clientX-310;
  if(y+200>window.innerHeight)y=evt.clientY-200;
  _hourTipEl.style.left=x+'px';
  _hourTipEl.style.top=y+'px';
}
function hideHourTip(){
  if(_hourTipEl)_hourTipEl.style.display='none';
}

// 단가 매핑 저장
async function savePriceMap(){
  var inputs=document.querySelectorAll('[data-pricemap]');
  var pm={};
  inputs.forEach(function(inp){
    var name=inp.getAttribute('data-pricemap');
    var val=parseInt(inp.value)||0;
    if(val>0) pm[name]=val;
  });
  S.priceMap=pm;
  try{
    var r=await fetch('/api/sales/price-map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({priceMap:pm})});
    var data=await r.json();
    if(data.ok){toast('✅ 단가 설정 저장 ('+Object.keys(pm).length+'개)','success');render();}
    else toast('❌ 저장 실패','error');
  }catch(e){toast('❌ '+e.message,'error')}
}
function autoFillPrices(){
  var sd=S.salesData||{};var items=sd.items||[];
  var inputs=document.querySelectorAll('[data-pricemap]');
  var filled=0;
  inputs.forEach(function(inp){
    var name=inp.getAttribute('data-pricemap');
    var item=items.find(function(i){return i.product===name;});
    if(item&&item.qty>0&&item.total_sales>0){
      var unit=Math.round(item.total_sales/item.qty);
      if(parseInt(inp.value||0)===0){inp.value=unit;filled++;}
    }
  });
  toast('🔄 POS 단가 '+filled+'건 자동반영 (저장 버튼을 눌러주세요)','info');
}

// 네이버 유의사항
async function crawlNaverNotice(){
  toast('🔍 네이버 플레이스에서 유의사항 가져오는 중...','info');
  try{
    var r=await fetch('/api/naver-notice/crawl',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.ok){
      var ta=document.getElementById('naverNoticeText');
      if(ta)ta.value=d.notice;
      toast('✅ 유의사항 가져오기 성공','success');
    }else{
      toast('⚠️ '+d.msg+' - 수동 입력해주세요','warning');
    }
  }catch(e){toast('❌ 오류: '+e.message,'error');}
}

var _oneClickRunning=false;
async function oneClickDaily(){
  if(_oneClickRunning){toast('⏳ 이미 실행 중입니다','warning');return;}
  _oneClickRunning=true;
  var btn=$('btnOneClick');
  if(btn){btn.textContent='⏳ 실행중...';btn.style.opacity='0.5';}
  
  try{
    var df=($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
    var dt=($('dailyDateTo')||{}).value||df;
    
    // Step 1: POS 크롤링
    toast('🚀 [1/5] POS 매출 크롤링...','info');
    await fetch('/api/sales/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dateFrom:df,dateTo:dt})});
    // 크롤링 완료 대기 (salesData 업데이트)
    await new Promise(function(r){
      var check=setInterval(function(){
        if(S.salesData&&S.salesData.items&&S.salesData.items.length>0){clearInterval(check);r();}
      },2000);
      setTimeout(function(){clearInterval(check);r();},60000);
    });
    render();
    
    // Step 2: 전주 비교
    toast('🚀 [2/5] 전주 대비 비교...','info');
    await compareSales('week');
    await new Promise(function(r){setTimeout(r,1000);});
    
    // Step 3: 전년 비교
    toast('🚀 [3/5] 전년 대비 비교...','info');
    await compareSalesAppend('year');
    await new Promise(function(r){setTimeout(r,1000);});
    
    // Step 4: AI 분석
    toast('🚀 [4/5] AI 매출 분석...','info');
    await aiDailyAnalysis();
    await new Promise(function(r){setTimeout(r,1000);});
    
    // Step 5: 카톡 발송
    toast('🚀 [5/6] 카톡 발송...','info');
    await sendDailyToKakao();
    
    // Step 6: 리뷰 크롤링 + 분석 (선택)
    toast('🚀 [6/6] 리뷰 분석...','info');
    try{
      var revR=await fetch('/api/reviews/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dateFrom:df,dateTo:df,maxPages:3})});
      var revData=await revR.json();
      if(revData.ok&&revData.count>0){
        S.reviewData={reviews:revData.reviews||[],crawledAt:new Date().toISOString(),dateFrom:df,dateTo:df};
        // AI 분석
        var anaR=await fetch('/api/reviews/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviews:revData.reviews})});
        var anaData=await anaR.json();
        if(anaData.ok){
          S.reviewAnalysis=anaData.analysis;
          toast('✅ 리뷰 '+revData.count+'건 분석 완료','success');
        }
      }
    }catch(e){console.log('리뷰 분석 스킵:',e.message);}
    
    toast('✅ 원클릭 마감 완료!','success');
  }catch(e){
    toast('❌ 원클릭 마감 오류: '+e.message,'error');
  }
  _oneClickRunning=false;
  if(btn){btn.textContent='🚀 원클릭 마감';btn.style.opacity='1';}
}

// ═══ 마감일지 카톡 발송 (비교 결과 포함) ═══
async function sendDailyToKakao(){
  var room=($('dailyKakaoRoom')||{}).value||(S.config&&S.config.kakao&&S.config.kakao.dailyRoom)||'';
  if(!room){toast('💬 카톡 발송방을 먼저 설정해주세요','warning');return;}
  
  var sd=S.salesData||{};
  var items=sd.items||[];
  var df=($('dailyDateFrom')||{}).value||new Date().toISOString().split('T')[0];
  
  // 요약 텍스트 생성
  var totalSales=(sd.grandTotal?sd.grandTotal.total_sales:0);
  var totalQty=(sd.grandTotal?sd.grandTotal.qty:0);
  var summary='📋 한국잠사플레이팜 일일마감일지\n';
  summary+='📅 '+df+'\n';
  summary+='━━━━━━━━━━━━━━━━\n';
  summary+='💰 총 매출: ₩'+totalSales.toLocaleString()+'\n';
  summary+='👥 총 판매: '+totalQty+'건\n';
  summary+='━━━━━━━━━━━━━━━━\n\n';
  
  // 상위 매출 상품
  var sorted=items.slice().sort(function(a,b){return(b.total_sales||0)-(a.total_sales||0)});
  var top=sorted.filter(function(i){return i.total_sales>0}).slice(0,8);
  if(top.length>0){
    summary+='📊 매출 TOP\n';
    top.forEach(function(i,idx){
      summary+=(idx+1)+'. '+i.product+' '+i.qty+'건 ₩'+(i.total_sales||0).toLocaleString()+'\n';
    });
    summary+='\n';
  }
  
  // 전주/전년 비교 결과 포함
  var compareArea=$('dailyCompareArea');
  if(compareArea&&compareArea.innerText.trim()){
    summary+='📈 매출 비교\n';
    var compText=compareArea.innerText.trim();
    // 핵심 숫자만 추출
    var lines=compText.split('\n').filter(function(l){return l.trim();});
    lines.forEach(function(l){
      l=l.trim();
      if(l.indexOf('대비')>=0||l.indexOf('▲')>=0||l.indexOf('▼')>=0||l.indexOf('매출')>=0&&l.indexOf('₩')>=0||l.indexOf('입장객')>=0&&(l.indexOf('명')>=0||l.indexOf('▲')>=0)){
        summary+=l+'\n';
      }
    });
    summary+='\n';
  }
  
  // AI/자동 분석 결과 전체 포함
  var aiArea=$('dailyAiArea');
  if(aiArea&&aiArea.innerText.trim()){
    var aiText=aiArea.innerText.trim();
    // ✕ 버튼, 제목 정리
    aiText=aiText.replace(/✕/g,'').replace(/🤖 AI 매출 분석/,'').replace(/📊 매출 자동 분석/,'').trim();
    // .env 안내문구 제거
    aiText=aiText.replace(/\.env에.*업그레이드됩니다\.?/g,'').trim();
    if(aiText){
      var isAI=aiArea.innerHTML.indexOf('AI 매출 분석')>=0;
      summary+='\n'+(isAI?'🤖 AI 분석':'📊 매출 분석')+'\n';
      summary+=aiText+'\n';
    }
  }
  
  // 0원 상품
  var zeroList=items.filter(function(i){return(i.total_sales||0)===0&&i.qty>0});
  if(zeroList.length>0){
    summary+='\n⚠️ 0원 상품: '+zeroList.map(function(i){return i.product+'×'+i.qty}).join(', ')+'\n';
  }
  
  toast('💬 마감일지 카톡 발송 중... ('+room+')','info');
  
  // 이미지 캡처
  var imageBase64='';
  var el=document.getElementById('dailyCaptureArea')||document.getElementById('dailyReportArea');
  if(typeof html2canvas==='undefined'){
    try{
      var sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      document.head.appendChild(sc);
      await new Promise(function(r){sc.onload=r;setTimeout(r,3000);});
    }catch(e){}
  }
  if(el&&typeof html2canvas!=='undefined'){
    try{
      var canvas=await html2canvas(el,{backgroundColor:'#080815',scale:1.5,useCORS:true,logging:false});
      imageBase64=canvas.toDataURL('image/png');
    }catch(e){console.error('캡처 실패:',e);}
  }
  
  // 서버 API 호출 (기본 발송방)
  try{
    var r=await fetch('/api/kakao/daily-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:room,summary:summary,image:imageBase64})});
    var data=await r.json();
    if(data.ok){
      toast('✅ 기본방 발송 완료! ('+room+')','success');
    }else{
      toast('❌ 카톡 발송 실패: '+(data.error||'알 수 없는 오류'),'error');
    }
  }catch(e){toast('❌ 발송 오류: '+e.message,'error');}
  
  // 섹션별 발송방 처리
  var secRooms=(S.config&&S.config.kakao&&S.config.kakao.sectionRooms)||{};
  var sections=getDailySections();
  var mapped=mapItemsToSections(items,sections);
  var pm=S.priceMap||{};
  var secSent=0;
  
  var secNameMap={ticket:'🎫 매표(입장)',ticket2:'🎫 단체',shop:'🛒 매점',rest:'☕ 누에쉼터',food:'🍽 단체식당',sheep:'🐑 양떼정원',exp:'🎪 체험'};
  
  for(var secId in secRooms){
    var secRoom=secRooms[secId];
    if(!secRoom||secRoom===room)continue; // 기본방과 같으면 건너뜀
    
    var secMsg='';
    
    if(secId==='summary'){
      // 매출 요약만 별도 발송
      secMsg='📊 매출 요약 ('+df+')\n💰 총 매출: ₩'+totalSales.toLocaleString()+'\n👥 총 판매: '+totalQty+'건\n';
    } else if(secId==='ai'){
      // AI 분석만 별도 발송
      if(aiArea&&aiArea.innerText.trim()){
        secMsg='🤖 AI 분석 ('+df+')\n'+aiArea.innerText.trim().replace(/✕/g,'').replace(/🤖 AI 매출 분석/,'').replace(/📊 매출 자동 분석/,'').replace(/\.env에.*업그레이드됩니다\.?/g,'').trim();
      }
    } else {
      // 특정 섹션 상세 데이터
      var secLabel=secNameMap[secId]||secId;
      secMsg=secLabel+' 마감 ('+df+')\n━━━━━━━━━━\n';
      var secItems=[];
      sections.forEach(function(sec){
        if(sec.id!==secId)return;
        sec.products.forEach(function(p){
          var key=sec.id+'_'+p.name;
          var d=mapped[key]||{qty:0,sales:0};
          var qty=d.qty||0;var sales=d.sales||0;
          if(sales===0&&qty>0){var pmP=pm[p.name]||p.price||0;if(pmP>0)sales=pmP*qty;}
          if(qty>0||sales>0) secItems.push({name:p.name,qty:qty,sales:sales});
        });
      });
      var secTotal=0;
      secItems.sort(function(a,b){return b.sales-a.sales;}).forEach(function(i){
        secMsg+=i.name+' '+i.qty+'건 ₩'+i.sales.toLocaleString()+'\n';
        secTotal+=i.sales;
      });
      if(secItems.length===0) continue;
      secMsg+='━━━━━━━━━━\n합계: ₩'+secTotal.toLocaleString()+' ('+secItems.reduce(function(a,i){return a+i.qty},0)+'건)\n';
    }
    
    if(!secMsg)continue;
    try{
      await fetch('/api/kakao/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:secMsg,room:secRoom})});
      secSent++;
    }catch(e){}
  }
  if(secSent>0) toast('📨 섹션별 '+secSent+'개 방 추가 발송 완료','success');
}

async function captureDaily(){
  var el=document.getElementById('dailyCaptureArea');
  if(!el){el=document.getElementById('dailyReportArea');}
  if(!el){toast('마감일지 영역 없음','error');return;}
  try{
    // html2canvas CDN 로드
    if(typeof html2canvas==='undefined'){
      var sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      document.head.appendChild(sc);
      await new Promise(function(r){sc.onload=r;setTimeout(r,3000);});
    }
    if(typeof html2canvas==='undefined'){
      var text=el.innerText;
      await navigator.clipboard.writeText(text);
      toast('텍스트로 복사됨 (이미지 라이브러리 로드 실패)','warning');
      return;
    }
    toast('📷 캡처 중... (매출요약 + 마감일지)','info');
    var canvas=await html2canvas(el,{backgroundColor:'#080815',scale:2,useCORS:true,logging:false});
    canvas.toBlob(async function(blob){
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        toast('✅ 이미지가 클립보드에 복사됨!','success');
      }catch(e){
        // 폴백: 새 탭에서 열기
        var url=URL.createObjectURL(blob);
        var w=window.open('');
        w.document.write('<img src="'+url+'" style="max-width:100%">');
        w.document.title='일일마감일지';
        toast('이미지가 새 탭에서 열림 (우클릭→저장)','info');
      }
    },'image/png');
  }catch(e){toast('캡처 오류: '+e.message,'error')}
}

// ═══ 월간/연간 매출 비교 ═══
async function comparePeriod(mode){
  var curMonth=S._calMonth||new Date().toISOString().substring(0,7);
  var curY=parseInt(curMonth.split('-')[0]);
  var curM=parseInt(curMonth.split('-')[1]);
  
  var compY,compM,label;
  if(mode==='month'){
    // 전월
    compM=curM-1;compY=curY;
    if(compM<1){compM=12;compY--;}
    label='전월 ('+compY+'-'+String(compM).padStart(2,'0')+')';
  } else {
    // 전년 동월
    compY=curY-1;compM=curM;
    label='전년 동월 ('+compY+'-'+String(compM).padStart(2,'0')+')';
  }
  
  var compMonth=compY+'-'+String(compM).padStart(2,'0');
  var lastDCur=new Date(curY,curM,0).getDate();
  var lastDComp=new Date(compY,compM,0).getDate();
  
  var area=$('salesCompareArea');
  if(!area)return;
  area.innerHTML='<div style="text-align:center;padding:12px;color:#888;font-size:11px">📊 '+label+' 비교 크롤링 중...</div>';
  
  // 현재 월 데이터 (이미 있으면 사용)
  var md=S.monthlyData||{};
  var curTotal=0,curDays=0,curQty=0;
  for(var d=1;d<=lastDCur;d++){
    var dk=curMonth+'-'+String(d).padStart(2,'0');
    if(md[dk]&&md[dk].sales>0){curTotal+=md[dk].sales;curQty+=md[dk].qty||0;curDays++;}
  }
  
  // 비교 월 크롤링
  toast('📊 '+label+' 데이터 크롤링 시작...','info');
  try{
    var r=await fetch('/api/sales/monthly',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:compMonth+'-01',to:compMonth+'-'+String(lastDComp).padStart(2,'0')})});
    // 크롤링은 백그라운드로 진행 → 폴링으로 대기
    var maxWait=60;var waited=0;
    while(waited<maxWait){
      await new Promise(function(rr){setTimeout(rr,3000);});
      waited+=3;
      // 월간 데이터 확인
      var compTotal=0,compDays=0,compQty=0;
      for(var d2=1;d2<=lastDComp;d2++){
        var dk2=compMonth+'-'+String(d2).padStart(2,'0');
        if(md[dk2]&&md[dk2].sales>0){compTotal+=md[dk2].sales;compQty+=md[dk2].qty||0;compDays++;}
      }
      if(compDays>0||waited>=maxWait){
        renderCompareResult(area,curMonth,compMonth,label,curTotal,curDays,curQty,compTotal,compDays,compQty,mode);
        return;
      }
    }
  }catch(e){
    area.innerHTML='<div style="color:#ef4444;font-size:11px">❌ 크롤링 실패: '+e.message+'</div>';
  }
}

  h+='<span>비교: ₩'+compTotal.toLocaleString()+'</span></div></div>';
  
  // 일평균
  h+='<div style="background:#0f172a;border-radius:8px;padding:10px;border:1px solid #334155">';
  h+='<div style="font-size:9px;color:#888">일평균 변동</div>';
  h+='<div style="font-size:18px;font-weight:800;color:'+(upA?'#10b981':'#ef4444')+'">'+(upA?'▲':'▼')+'₩'+Math.abs(diffAvg).toLocaleString()+'</div>';

  // 영업일/건수
  h+='<div style="background:#0f172a;border-radius:8px;padding:10px;border:1px solid #334155">';
  h+='<div style="font-size:9px;color:#888">영업일 / 판매건</div>';
  h+='<div style="font-size:16px;font-weight:800;color:#fff">'+curDays+'일 <span style="font-size:10px;color:#555">/ '+compDays+'일</span></div>';
  h+='<div style="font-size:14px;font-weight:700;color:#3b82f6">'+curQty.toLocaleString()+'건 <span style="font-size:10px;color:#555">/ '+compQty.toLocaleString()+'건</span></div>';
  h+='</div>';
  h+='</div>';
  
  // 비교 바 차트
  var maxBar=Math.max(curTotal,compTotal)||1;
  h+='<div style="margin-bottom:8px">';
  h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
  h+='<span style="width:80px;font-size:10px;color:#cbd5e1">'+curMonth+'</span>';
  h+='<div style="flex:1;height:14px;background:#1e293b;border-radius:4px"><div style="height:100%;width:'+Math.round(curTotal/maxBar*100)+'%;background:'+modeColor+';border-radius:4px"></div></div>';
  h+='<span style="width:80px;text-align:right;font-size:10px;color:#fff;font-weight:600">₩'+curTotal.toLocaleString()+'</span></div>';
  h+='<div style="display:flex;align-items:center;gap:6px">';
  h+='<span style="width:80px;font-size:10px;color:#888">'+compMonth+'</span>';
  h+='<div style="flex:1;height:14px;background:#1e293b;border-radius:4px"><div style="height:100%;width:'+Math.round(compTotal/maxBar*100)+'%;background:#555;border-radius:4px"></div></div>';
  h+='<span style="width:80px;text-align:right;font-size:10px;color:#888">₩'+compTotal.toLocaleString()+'</span></div>';

  // 캐시 저장 (카톡용)
  S._lastCompare={label:label,curMonth:curMonth,compMonth:compMonth,curTotal:curTotal,compTotal:compTotal,curDays:curDays,compDays:compDays,curQty:curQty,compQty:compQty,curAvg:curAvg,compAvg:compAvg,diffSales:diffSales,pctSales:pctSales};
  
  area.innerHTML=h;
}

async function sendCompareKakao(){
  var c=S._lastCompare;

async function crawlReviews(){
  var df=($('reviewDateFrom')||{}).value||'';
  var dt=($('reviewDateTo')||{}).value||'';
  toast('📝 네이버 리뷰 크롤링 중...','info');
  try{
    var r=await fetch('/api/reviews/crawl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dateFrom:df,dateTo:dt,maxPages:5})});

    if(data.ok){
      S.reviewData={reviews:data.reviews||[],crawledAt:new Date().toISOString(),dateFrom:df,dateTo:dt};
      toast('✅ 리뷰 '+data.count+'건 수집 완료!','success');
      renderReviewPanel();
    } else {
      toast('❌ '+(data.error||'크롤링 실패'),'error');
    }
  }catch(e){toast('❌ '+e.message,'error');}
}

async function analyzeReviews(){
  var rd=S.reviewData||{};

  }catch(e){toast('❌ '+e.message,'error');}

// ═══ 시간대별 카톡 발송 ═══
async function sendTimeToKakao(){
  var room=($('timeKakaoRoom')||{}).value||(S.config&&S.config.kakao&&S.config.kakao.timeRoom)||(S.config&&S.config.kakao&&S.config.kakao.dailyRoom)||'';
  if(!room){toast('💬 카톡 발송방을 설정해주세요','warning');return;}
  
  var ts=S.timeSalesData||{};
  var hourly=ts.hourly||[];
  var gt=ts.grand_total||{};
  var df=(ts.date_from||new Date().toISOString().split('T')[0]);
  
  // 텍스트 요약
  var msg='⏰ 시간대별 POS 매출\n📅 '+df+'\n━━━━━━━━━━━━━━━━\n';
  msg+='💰 총 매출: ₩'+(gt.total_sales||0).toLocaleString()+'\n';
  msg+='📦 총 판매: '+(gt.qty||0)+'건\n━━━━━━━━━━━━━━━━\n\n';
  
  // 시간대별
  if(hourly.length>0){
    msg+='📊 시간대별\n';
    var cumS=0;
    hourly.forEach(function(hr){
      if(hr.sales<=0)return;
      cumS+=hr.sales;
      var pct=gt.total_sales>0?Math.round(cumS/gt.total_sales*100):0;
      msg+=hr.hour+'시 '+hr.qty+'건 ₩'+hr.sales.toLocaleString()+' ('+pct+'%)\n';
    });
    msg+='\n';
    
    // 피크
    var sorted=hourly.slice().sort(function(a,b){return b.sales-a.sales;});
    var peak=sorted.filter(function(h2){return h2.sales>0;}).slice(0,3);
    if(peak.length>0){
      msg+='🏆 피크: '+peak.map(function(p,i){return['1️⃣','2️⃣','3️⃣'][i]+p.hour+'시 ₩'+p.sales.toLocaleString();}).join(' ')+'\n';
    }
    
    // 오전/오후
    var amS=0,pmS=0;
    hourly.forEach(function(hr){if(parseInt(hr.hour)<12)amS+=hr.sales;else pmS+=hr.sales;});
    msg+='\n오전: ₩'+amS.toLocaleString()+' / 오후: ₩'+pmS.toLocaleString()+'\n';
  }
  
  toast('💬 시간대별 매출 카톡 발송 중... ('+room+')','info');
  
  // 이미지 캡처 (시간대별 차트)
  var imageBase64='';
  var el=$('timeChartArea');
  if(typeof html2canvas==='undefined'){try{var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(sc);await new Promise(function(r){sc.onload=r;setTimeout(r,3000);});}catch(e){}}
  if(el&&typeof html2canvas!=='undefined'){
    try{var canvas=await html2canvas(el,{backgroundColor:'#080815',scale:1.5,useCORS:true,logging:false});imageBase64=canvas.toDataURL('image/png');}catch(e){}
  }
  
  try{
    var r=await fetch('/api/kakao/daily-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:room,summary:msg,image:imageBase64})});
    var data=await r.json();
    if(data.ok) toast('✅ 시간대별 매출 카톡 발송 완료!','success');
    else toast('❌ 발송 실패: '+(data.error||''),'error');
  }catch(e){toast('❌ '+e.message,'error');}
}

// ═══ 시간대별 그리드 단가 저장 ═══
async function saveGridPrices(){
  var inputs=document.querySelectorAll('[data-price-product]');
  if(!inputs.length){toast('단가 입력 필드 없음','warning');return;}
  var pm=S.priceMap||{};
  var changed=0;
  inputs.forEach(function(inp){
    var name=inp.getAttribute('data-price-product');
    var val=parseInt(inp.value)||0;
    if(name&&val>=0){
      if(pm[name]!==val){pm[name]=val;changed++;}
    }
  });
  S.priceMap=pm;
  // 서버에 저장
  try{
    var r=await fetch('/api/sales/price-map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({priceMap:pm})});
    var data=await r.json();
    if(data.ok){
      toast('✅ 단가 저장 완료 ('+changed+'건 변경, 총 '+Object.keys(pm).length+'개)','success');
    }else{
      toast('❌ 단가 저장 실패','error');
    }
  }catch(e){toast('❌ '+e.message,'error');}
}

async function crawlMonthly(){

function setMsgProvider(p){api('msg/config',{provider:p}).then(function(){S.config.msg=S.config.msg||{};S.config.msg.provider=p;render();toast('📡 '+p+' 선택됨','info');})}
function saveMsgConfig(type){
  var d={};
  if(type==='ppurio'){d={ppurioId:$('msgPpurioId').value,ppurioKey:$('msgPpurioKey').value,ppurioSender:$('msgPpurioSender').value};}
  else if(type==='coolsms'){d={coolsmsKey:$('msgCoolKey').value,coolsmsSecret:$('msgCoolSecret').value,coolsmsSender:$('msgCoolSender').value};}
  else if(type==='kakao'){d={ppurioId:$('msgKakaoId').value,ppurioKey:$('msgKakaoKey').value,kakaoSenderKey:$('msgKakaoSender').value,kakaoTemplateCode:$('msgKakaoTmpl').value,ppurioSender:$('msgKakaoFrom').value};}
  api('msg/config',d).then(function(r){if(r.ok)toast('💾 저장됨','success');});
}
function testMsg(){
  var ph=$('testPhone').value;if(!ph){toast('전화번호 입력','error');return;}
  var tmplId=$('testTmpl').value;
  var pv=(S.config&&S.config.msg&&S.config.msg.provider)||'ppurio';
  toast('🧪 테스트 발송중...','info');
  api('msg/test',{phone:ph,template:tmplId}).then(function(r){
    var phones=ph.split(/[,\s\n]+/).filter(Boolean);
    phones.forEach(function(p){logSmsSend(p.trim(),'테스트',tmplId,r.ok,pv,'','test');});
    if(r.ok)toast('✅ 테스트 성공!','success');else toast('❌ '+(r.error||r.detail||'실패'),'error');
    if(tab==='msg')render();
  });
}
async function sendSpecific(){
  var ph=($('specificPhone')||{}).value||'';
  if(!ph){toast('수신 전화번호를 입력해주세요','error');return;}
  var msg=($('specificMsg')||{}).value||'';
  var tmpl=($('specificTmpl')||{}).value||'';

  if(!msg&&!tmpl){toast('메시지 또는 템플릿을 선택해주세요','error');return;}

  if(!confirm('📱 '+ph+' 번호로 메시지를 발송합니다.\n\n진행하시겠습니까?'))return;
  toast('📱 '+ph+' 발송중...','info');
  var pv=(S.config&&S.config.msg&&S.config.msg.provider)||'ppurio';

  try{
    var r=await api('msg/send-specific',{phone:ph,message:msg,template:tmpl});
    var phones=ph.split(/[,\s\n]+/).filter(Boolean);
    phones.forEach(function(p){logSmsSend(p.trim(),'직접발송',tmpl||'직접입력',r.ok,pv,'','specific');});
    if(r.ok) toast('✅ '+ph+' 발송 완료!','success');
    else toast('❌ '+(r.error||'실패'),'error');
    if(tab==='msg')render();
  }catch(e){toast('❌ '+e.message,'error');}
}
function bulkSend(){
  var targets=S.tickets.filter(function(t){return isU(t)&&t.phone&&!t.smsSent});
  var cnt=targets.length;
  if(!confirm('📨 미발송 '+cnt+'건에 문자를 일괄 발송합니다.\n\n진행하시겠습니까?'))return;
  toast('📨 대량발송 시작...','info');
  var tmpl=$('bulkTmpl').value;
  var pv=(S.config&&S.config.msg&&S.config.msg.provider)||'ppurio';
  api('msg/bulk',{template:tmpl}).then(function(r){
    targets.forEach(function(t){logSmsSend(t.phone,t.buyer,tmpl,r.ok,pv,t.id,'bulk');});
    if(r.ok)toast('📨 완료: 성공 '+r.success+' / 실패 '+r.fail,'success');
    else toast('❌ '+(r.error||'실패'),'error');render();
  });
}
function addTemplate(){
  api('msg/template',{action:'add',name:'새 템플릿',body:'[한국잠사박물관]\n{buyer}님 안녕하세요.\n\n내용을 입력하세요.',type:'sms'}).then(function(r){
    if(r.ok){S.config.msg.templates.push(r.template);render();toast('📝 추가됨 — 내용을 편집하세요','success');}
  });
}
function saveTemplate(id){
  var name=$('tn_'+id).value;
  var body=$('tb_'+id).value;
  var type=$('tt_'+id).value;
  api('msg/template',{action:'edit',id:id,name:name,body:body,type:type}).then(function(r){
    if(r.ok){
      var ts=S.config.msg.templates;
      for(var i=0;i<ts.length;i++){if(ts[i].id===id){ts[i].name=name;ts[i].body=body;ts[i].type=type;break;}}
      toast('💾 "'+name+'" 저장됨','success');
    }
  });
}
function previewTemplate(id){
  var body=$('tb_'+id).value;
  var preview=body.replace(/\{buyer\}/g,'홍길동').replace(/\{product\}/g,'눈썰매장+잠사박물관').replace(/\{qty\}/g,'3').replace(/\{phone\}/g,'010-1234-5678').replace(/\{orderNo\}/g,'L260226012345').replace(/\{qrUrl\}/g,'https://jamsabak.kr/qr/L123').replace(/\{date\}/g,new Date().toISOString().split('T')[0]).replace(/\{notice\}/g,(S.config&&S.config.msg&&S.config.msg.naverNotice)||'운영10~18시/입장마감17시/24개월미만무료').replace(/\{sales\}/g,generateSalesSummary()||'총₩1,427,500/294건 피크13시(₩377,000·26%)').replace(/\{reviewUrl\}/g, location.origin+'/r');
  var div=document.createElement('div');
  div.innerHTML='<div onclick="this.remove()" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999"></div>'
    +'<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;background:#1a1a2e;border-radius:12px;padding:16px;width:90%;max-width:360px;border:1px solid #252540">'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:12px;font-weight:700;color:#fff">👁 미리보기</span><button onclick="this.closest(\'div\').parentElement.remove()" style="background:none;border:none;color:#666;font-size:16px;cursor:pointer">✕</button></div>'
    +'<div style="background:#0a3a0a;border-radius:10px;padding:12px;font-size:11px;color:#e0e0e0;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto;border:1px solid #1a5a1a">'+preview.replace(/</g,'&lt;')+'</div>'
    +'<div style="font-size:8px;color:#555;margin-top:6px;text-align:center">실제 발송될 내용 (변수가 치환된 상태)</div></div>';
  document.body.appendChild(div);
}
function deleteTemplate(id){
  if(!confirm('이 템플릿을 삭제하시겠습니까?'))return;
  api('msg/template',{action:'delete',id:id}).then(function(r){
    if(r.ok){var ts=S.config.msg.templates;S.config.msg.templates=ts.filter(function(x){return x.id!==id;});render();toast('🗑 삭제됨','success');}
  });
}
function loadMsgHistory(){
  fetch('/api/msg/history').then(function(r){return r.json()}).then(function(d){S.msgHistory=d.history||[];render();});
}

async function execCrawlEval(service){

  var r=await api('crawl/exec',{service:service,action:'eval',code:code});

  }
  setTimeout(function(){refreshLive(service)},500);
}

function setDateRange(n){
  var today=new Date();
  var from,to;
  if(n===0){from=to=today}
  else if(n===1){var y=new Date(today);y.setDate(y.getDate()-1);from=to=y}
  else if(n===-1){from=new Date(today.getFullYear(),today.getMonth(),1);to=today}
  else{from=new Date(today);from.setDate(from.getDate()-(n-1));to=today}
  var fmt=function(d){return d.toISOString().split('T')[0]};
  if($('crawlFrom'))$('crawlFrom').value=fmt(from);
  if($('crawlTo'))$('crawlTo').value=fmt(to);
  saveDateRange();
}
function saveDateRange(){
  var f=($('crawlFrom')||{}).value||'';
  var t=($('crawlTo')||{}).value||'';
  api('config',{field:'crawlDateFrom',value:f});
  api('config',{field:'crawlDateTo',value:t});
  toast('📅 기간: '+f+' ~ '+t,'info');
}

// ═══ 파이프라인 ═══
var pipeData=null;
var pipeExpandedFn=null;
var pipeAiHistory=[];
var pipeImages=[]; // [{data:base64, mediaType:'image/png', thumb:dataUrl}]

function pipeAddImage(file){
  if(!file||!file.type.startsWith('image/'))return;
  if(pipeImages.length>=3){toast('최대 3장까지 첨부 가능','warning');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var dataUrl=e.target.result;
    var base64=dataUrl.split(',')[1];
    var mediaType=file.type;
    pipeImages.push({data:base64,mediaType:mediaType,thumb:dataUrl});
    renderPipeImagePreview();
  };
  reader.readAsDataURL(file);
}

function pipeRemoveImage(idx){
  pipeImages.splice(idx,1);
  renderPipeImagePreview();
}

function renderPipeImagePreview(){
  var el=document.getElementById('pipeImagePreview');
  if(!el)return;
  if(pipeImages.length===0){el.innerHTML='';return;}
  var h='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
  pipeImages.forEach(function(img,i){
    h+='<div style="position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid #333">';
    h+='<img src="'+img.thumb+'" style="width:100%;height:100%;object-fit:cover">';
    h+='<button onclick="pipeRemoveImage('+i+')" style="position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:9px;cursor:pointer;line-height:16px;padding:0">✕</button>';
    h+='</div>';
  });
  h+='<div style="font-size:8px;color:#666;align-self:center">'+pipeImages.length+'/3</div></div>';
  el.innerHTML=h;
}

async function applyPipeCode(fn){
  if(!confirm('⚠️ server.js 파일을 수정합니다.\n\n함수: '+fn+'\n백업이 자동 생성됩니다.\n서버 재시작 후 반영됩니다.\n\n적용하시겠습니까?'))return;
  
  var latest=pipeAiHistory.find(function(h){return h.fn===fn});
  if(!latest){toast('❌ 적용할 코드가 없습니다','error');return;}
  
  var r=await api('pipeline/apply',{funcName:fn,newCode:latest.newCode});
  if(r.ok){
    toast('✅ '+r.msg,'success');
    pipeImages=[];
    document.getElementById('pipeAiStatus').innerHTML='<div style="color:#10b981;font-size:11px;padding:8px">✅ 적용 완료! 서버 재시작 후 반영됩니다. (백업: '+r.backup+')</div>';
  } else {
    toast('❌ '+r.error,'error');
  }
}

async function rollbackPipe(){
  if(!confirm('⏪ 마지막 백업으로 롤백합니다.\n서버 재시작 후 반영됩니다.\n\n진행하시겠습니까?'))return;
  var r=await api('pipeline/rollback',{});
  if(r.ok)toast('✅ '+r.msg,'success');
  else toast('❌ '+r.error,'error');
}

function saveAiKey(){
  var key=$('aiApiKey').value.trim();
  fetch('/api/ai/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:key})})
  .then(function(r){return r.json()}).then(function(d){toast(d.hasKey?'🔑 API 키 저장됨':'🔑 API 키 삭제됨','success')});
}

function manualDiag(svc){
  toast('🤖 ['+svc+'] 진단 시작...','info');
  fetch('/api/ai/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:svc,error:'수동 진단 요청 - 현재 상태 점검'})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok){toast('🔍 진단 완료: '+(d.diag?d.diag.diagnosis:''),'success')}
    else{toast('진단 실패: '+(d.error||''),'error')}
    render();
  }).catch(function(e){toast('진단 오류: '+e.message,'error')});
}

function loadAiHistory(){
  fetch('/api/ai/history').then(function(r){return r.json()}).then(function(d){
    S.aiDiags=(d.history||[]).map(function(h){return{diag:h,status:h.status}});
    render();
    toast('진단 이력 갱신','info');
  });
}

function pinPress(n){
  if(n==='⌫'){pinInput=pinInput.slice(0,-1);render();return}
  if(pinInput.length>=4)return;
  pinInput+=n;
  if(pinInput.length===4){
    api('auth/login',{pin:pinInput}).then(function(r){
      if(r.ok){authUser=r.staff;toast('👋 '+r.staff.name+' 로그인!','success')}
      else{toast('❌ PIN 불일치','error')}
      pinInput='';render();
    });
  } else render();
}

function doIssue(){
  var buyer=($('issBuyer')||{}).value||'',phone=($('issPhone')||{}).value||'';
  if(!buyer||!phone){toast('구매자, 전화번호 필수!','warning');return}
  var srcEl=document.querySelector('[id^=src_][style*="font-weight:700"]');
  var source=srcEl?srcEl.id.replace('src_',''):'manual';
  var prodSel=$('issProd'),prodName=prodSel?prodSel.options[prodSel.selectedIndex].text.split('(')[0].trim():'';
  api('ticket/issue',{buyer:buyer,phone:phone,product:prodName,unitPrice:parseInt(($('issPrice')||{}).value)||0,price:(parseInt(($('issPrice')||{}).value)||0)*(parseInt(($('issQty')||{}).value)||1),qty:parseInt(($('issQty')||{}).value)||1,source:source,issuedBy:authUser?authUser.name:'',memo:($('issMemo')||{}).value||'',group:($('issGroup')||{}).value||''}).then(function(r){
    if(r.ok){toast('🎫 '+buyer+' 발권 완료!','success');if($('issBuyer'))$('issBuyer').value='';if($('issPhone'))$('issPhone').value='';render()}else toast('❌ '+(r.error||'실패'),'error')
  });
}

function doVerify(){
  var v=($('verifyInp')||{}).value||'';if(!v)return;
  var tk=S.tickets.find(function(t){return t.qrCode===v||t.phone===v||t.buyer===v||t.orderNo===v||String(t.id)===v});
  if(tk&&(tk.status==='사용가능'||tk.status==='확정'||tk.status==='issued')){verifiedTk=tk;toast('✅ '+tk.buyer+' 확인!','success');render()}
  else if(tk){toast('이미 사용된 티켓','warning')}
  else{toast('❌ 티켓을 찾을 수 없습니다','error')}
}

function bookExp(time){
  if(!verifiedTk){toast('먼저 티켓을 확인하세요','warning');return}
  var exp=(S.experiences||[]).find(function(e){return e.id===selExp});if(!exp)return;
  api('exp-booking/add',{expId:selExp,date:selExpDate,time:time,buyer:verifiedTk.buyer,phone:verifiedTk.phone,count:1,source:verifiedTk.source||'manual',ticketQR:verifiedTk.qrCode||''}).then(function(r){
    if(r.ok){S.expBookings=[r.booking].concat(S.expBookings||[]);toast('🎯 '+exp.name+' '+time+' 예약!','success');render()}else toast('❌ '+(r.error||'실패'),'error')
  });

function addExpPrompt(){
  var name=prompt('체험명:');if(!name)return;
  var cap=parseInt(prompt('정원 (기본 15):'))||15;
  var price=parseInt(prompt('가격 (기본 8000):'))||8000;
  var dur=parseInt(prompt('소요시간(분, 기본 30):'))||30;
  api('experience/add',{name:name,capacity:cap,price:price,duration:dur}).then(function(r){
    if(r.ok){S.experiences.push(r.experience);toast('✅ "'+name+'" 추가!','success');render()}

function calNavMonth(dir){
  var d=new Date(calMonth+'-01');

}

function renderRentalCalendar(filteredRentals,RENTAL_TIMES){
  var year=parseInt(calMonth.split('-')[0]);
  var month=parseInt(calMonth.split('-')[1])-1;
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var today=new Date().toISOString().split('T')[0];
  var allBookings=S.rentalBookings||[];

  var calHtml='';
  filteredRentals.forEach(function(rental){
    var rBks=allBookings.filter(function(b){return b.rentalId===rental.id&&b.date&&b.date.startsWith(calMonth)&&b.status!=='cancelled'});
    var bkByDate={};
    rBks.forEach(function(b){
      if(!bkByDate[b.date])bkByDate[b.date]=[];
      bkByDate[b.date].push(b);
    });

    calHtml+='<div class="card" style="margin-bottom:12px;overflow-x:auto">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
      +'<span style="font-size:16px">'+rentalIcon(rental.type)+'</span>'
      +'<span style="font-size:14px;font-weight:700;color:'+rental.color+'">'+rental.name+'</span>'
      +'<span style="font-size:10px;color:#888">'+rental.price.toLocaleString()+'원</span>'
      +(rental.desc?'<span style="font-size:9px;color:#666">'+rental.desc+'</span>':'')
      +'<span style="font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(59,130,246,.1);color:#60a5fa;margin-left:auto">이번달 '+rBks.length+'건</span>'
      +'</div>';

    calHtml+='<table style="width:100%;font-size:10px;border-collapse:collapse">'
      +'<thead><tr>';
    ['일','월','화','수','목','금','토'].forEach(function(d,i){
      var col=i===0?'#ef4444':i===6?'#3b82f6':'#aaa';
      calHtml+='<th style="padding:4px;text-align:center;color:'+col+';font-weight:600;font-size:10px;border-bottom:1px solid #252540">'+d+'</th>';
    });
    calHtml+='</tr></thead><tbody><tr>';

    for(var i=0;i<firstDay;i++){
      calHtml+='<td style="padding:2px;vertical-align:top;height:60px;border:1px solid #151528"></td>';
    }

    for(var day=1;day<=daysInMonth;day++){
      var dateStr=calMonth+'-'+String(day).padStart(2,'0');
      var dayBks=bkByDate[dateStr]||[];
      var isToday=dateStr===today;
      var isSel=dateStr===selRentalDate;
      var dow=(firstDay+day-1)%7;
      var dayColor=dow===0?'#ef4444':dow===6?'#3b82f6':'#ccc';
      var totalSlots=RENTAL_TIMES.length;
      var bookedSlots=dayBks.length;
      var ratio=bookedSlots/totalSlots;

      var bgColor='transparent';
      if(bookedSlots>0&&ratio<0.5)bgColor='rgba(245,158,11,.08)';
      else if(ratio>=0.5&&ratio<1)bgColor='rgba(239,68,68,.08)';
      else if(ratio>=1)bgColor='rgba(239,68,68,.15)';

      calHtml+='<td onclick="selRentalDate=\''+dateStr+'\';render()" style="padding:3px;vertical-align:top;height:60px;border:1px solid '+(isSel?'#3b82f6':'#151528')+';cursor:pointer;background:'+bgColor+';transition:all .15s" onmouseover="this.style.background=\'rgba(59,130,246,.1)\'" onmouseout="this.style.background=\''+bgColor+'\'">';
      calHtml+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">';
      calHtml+='<span style="font-size:11px;font-weight:'+(isToday?'800':'500')+';color:'+(isToday?'#10b981':dayColor)+';'+(isToday?'background:rgba(16,185,129,.15);padding:1px 5px;border-radius:4px':'')+'">'+day+'</span>';
      if(bookedSlots>0){
        calHtml+='<span style="font-size:8px;padding:1px 4px;border-radius:4px;background:'+(ratio>=1?'rgba(239,68,68,.2);color:#ef4444':'rgba(245,158,11,.2);color:#f59e0b')+';font-weight:700">'+bookedSlots+'/'+totalSlots+'</span>';
      }
      calHtml+='</div>';

      if(dayBks.length>0){
        dayBks.slice(0,2).forEach(function(bk){
          var statusColor=bk.status==='used'?'#888':'#10b981';
          calHtml+='<div style="font-size:8px;padding:1px 3px;margin-bottom:1px;border-radius:3px;background:rgba(16,185,129,.08);color:'+statusColor+';overflow:hidden;white-space:nowrap;text-overflow:ellipsis" title="'+bk.time+' '+bk.buyer+'">'
            +(bk.time?bk.time.split('~')[0]:'')+'<span style="color:#888"> '+bk.buyer+'</span></div>';
        });
        if(dayBks.length>2){
          calHtml+='<div style="font-size:8px;color:#888;text-align:center">+'+(dayBks.length-2)+'건</div>';
        }
      } else {
        calHtml+='<div style="font-size:8px;color:#333;text-align:center;margin-top:6px">-</div>';
      }

      calHtml+='</td>';

      if(dow===6&&day<daysInMonth)calHtml+='</tr><tr>';
    }

    var lastDow=(firstDay+daysInMonth-1)%7;
    for(var i=lastDow+1;i<7;i++){
      calHtml+='<td style="padding:2px;vertical-align:top;height:60px;border:1px solid #151528"></td>';
    }
    calHtml+='</tr></tbody></table>';

    calHtml+='<div style="display:flex;gap:10px;margin-top:8px;font-size:9px;color:#888;justify-content:flex-end">'
      +'<span>⬜ 여유</span>'
      +'<span style="color:#f59e0b">🟨 일부예약</span>'
      +'<span style="color:#ef4444">🟥 마감임박</span>'
      +'<span style="color:#ef4444;font-weight:700">🔴 전체예약</span>'
      +'</div>';
    calHtml+='</div>';
  });

  if(filteredRentals.length===0){
    calHtml='<div class="card" style="text-align:center;padding:30px;color:#555">등록된 대여 시설이 없습니다</div>';
  }

  return calHtml;
}

function getVisitorPaths(){
  var logs=S.spotScanLogs||[];
  var byPhone={};
  logs.forEach(function(l){
    var key=l.phone||l.ip||'anon-'+Math.random();
    if(l.phone&&l.phone.length>=4)key=l.phone;
    else return;
    if(!byPhone[key])byPhone[key]={phone:key,visitor:l.visitor||'',path:[]};
    byPhone[key].path.push({spotId:l.spotId,time:l.time});
    if(l.visitor&&l.visitor!=='방문자')byPhone[key].visitor=l.visitor;
  });
  return Object.values(byPhone).filter(function(v){return v.path.length>=2}).sort(function(a,b){return b.path.length-a.path.length});
}

// ═══ 방문센터 관리 함수들 ═══
function updateCrowd(id,level){
  api('visit-center/crowd',{id:id,level:level}).then(function(){toast('✅ 혼잡도 변경','success');loadState()});
}
function updateCrowdNote(id,note){
  var vc=S.visitCenter||{};var crowds=vc.crowds||[];
  var item=crowds.find(function(c){return c.id===id});
  if(item){item.note=note;api('visit-center',{field:'crowds',value:crowds}).then(function(){toast('✅ 메모 저장','success');loadState()})}
}
function addCrowd(){
  var name=document.getElementById('vcNewCrowdName').value.trim();
  var icon=document.getElementById('vcNewCrowdIcon').value.trim()||'📍';
  if(!name)return toast('이름을 입력하세요','info');
  var vc=S.visitCenter||{};var crowds=vc.crowds||[];
  crowds.push({id:'crowd-'+Date.now(),name:name,icon:icon,level:'low',note:''});
  api('visit-center',{field:'crowds',value:crowds}).then(function(){toast('✅ 추가됨','success');loadState()});
}
function toggleExpEnabled(i){
  var vc=S.visitCenter||{};var exps=vc.experiences||[];
  if(exps[i])exps[i].enabled=!exps[i].enabled;
  api('visit-center',{field:'experiences',value:exps}).then(function(){toast('✅ 변경됨','success');loadState()});
}
function updateExp(i){
  var vc=S.visitCenter||{};var exps=vc.experiences||[];
  if(!exps[i])return;
  exps[i].time=document.getElementById('vcExpTime'+i).value;
  exps[i].badge=document.getElementById('vcExpBadge'+i).value;
  api('visit-center',{field:'experiences',value:exps}).then(function(){toast('✅ 저장','success');loadState()});
}
function addExp(){
  var icon=document.getElementById('vcNewExpIcon').value.trim()||'🎯';
  var name=document.getElementById('vcNewExpName').value.trim();
  var time=document.getElementById('vcNewExpTime').value.trim()||'상시';
  if(!name)return toast('체험명을 입력하세요','info');
  var vc=S.visitCenter||{};var exps=vc.experiences||[];
  exps.push({id:'exp-'+Date.now(),name:name,icon:icon,time:time,badge:'신규',badgeColor:'green',enabled:true});
  api('visit-center',{field:'experiences',value:exps}).then(function(){toast('✅ 추가됨','success');loadState()});
}
function updateMenuItem(i){
  var vc=S.visitCenter||{};var items=vc.menuItems||[];
  if(!items[i])return;
  items[i].name=document.getElementById('vcMenuName'+i).value;
  items[i].price=parseInt(document.getElementById('vcMenuPrice'+i).value)||0;
  api('visit-center',{field:'menuItems',value:items}).then(function(){toast('✅ 저장','success');loadState()});
}
function deleteMenuItem(i){
  var vc=S.visitCenter||{};var items=vc.menuItems||[];
  items.splice(i,1);
  api('visit-center',{field:'menuItems',value:items}).then(function(){toast('✅ 삭제됨','success');loadState()});
}
function addMenuItem(){
  var icon=document.getElementById('vcNewMenuIcon').value.trim()||'🍕';
  var name=document.getElementById('vcNewMenuName').value.trim();
  var price=parseInt(document.getElementById('vcNewMenuPrice').value)||0;
  if(!name)return toast('메뉴명을 입력하세요','info');
  var vc=S.visitCenter||{};var items=vc.menuItems||[];
  items.push({id:'menu-'+Date.now(),name:name,price:price,icon:icon,enabled:true});
  api('visit-center',{field:'menuItems',value:items}).then(function(){toast('✅ 추가됨','success');loadState()});
}
function toggleNotice(i){
  var vc=S.visitCenter||{};var notices=vc.notices||[];
  if(notices[i])notices[i].enabled=!notices[i].enabled;
  api('visit-center',{field:'notices',value:notices}).then(function(){toast('✅ 변경됨','success');loadState()});
}
function updateNotice(i){
  var vc=S.visitCenter||{};var notices=vc.notices||[];
  if(!notices[i])return;
  notices[i].text=document.getElementById('vcNotice'+i).value;
  notices[i].type=document.getElementById('vcNoticeType'+i).value;
  api('visit-center',{field:'notices',value:notices}).then(function(){toast('✅ 저장','success');loadState()});
}
function deleteNotice(i){
  var vc=S.visitCenter||{};var notices=vc.notices||[];
  notices.splice(i,1);
  api('visit-center',{field:'notices',value:notices}).then(function(){toast('✅ 삭제됨','success');loadState()});
}
function addNotice(){
  var text=document.getElementById('vcNewNotice').value.trim();
  if(!text)return toast('내용을 입력하세요','info');
  var vc=S.visitCenter||{};var notices=vc.notices||[];
  notices.push({id:'notice-'+Date.now(),text:text,type:'info',enabled:true});
  api('visit-center',{field:'notices',value:notices}).then(function(){toast('✅ 추가됨','success');loadState()});
}
function saveDesign(){
  var title=document.getElementById('vcHeroTitle').value;
  var desc=document.getElementById('vcHeroDesc').value;
  api('visit-center',{field:'heroTitle',value:title}).then(function(){
    return api('visit-center',{field:'heroDesc',value:desc});
  }).then(function(){toast('✅ 디자인 저장','success');loadState()});
}

function renderPortal(){
  var h='<div style="max-width:1100px;margin:0 auto;animation:fadeIn .3s">';
  var todayStr=new Date().toISOString().split('T')[0];
  var logs=(S.spotScanLogs||[]).filter(function(l){return l.time&&l.time.startsWith(todayStr)});
  var totalScans=logs.length;

var _naverMapLoaded=false,_naverMapLoadedKey='';
function loadNaverMapScript(cb){
  var key=localStorage.getItem('__naver_map_key')||'';
  if(!key)return;
  if(_naverMapLoaded&&_naverMapLoadedKey===key&&typeof naver!=='undefined'&&naver.maps){if(cb)cb();return;}
  var existing=document.querySelector('script[src*="oapi.map.naver"]');
  if(existing){
    if(_naverMapLoadedKey===key&&typeof naver!=='undefined'&&naver.maps){_naverMapLoaded=true;if(cb)cb();return;}
    existing.remove();
    if(typeof naver!=='undefined')try{delete window.naver}catch(e){window.naver=undefined}
    _naverMapLoaded=false;
  }
  var s=document.createElement('script');
  s.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId='+key+'&submodules=geocoder';
  s.onload=function(){_naverMapLoaded=true;_naverMapLoadedKey=key;if(cb)cb();};
  s.onerror=function(){toast('네이버 지도 스크립트 로드 실패 - Client ID를 확인하세요','error');};
  document.head.appendChild(s);
}

  });
}
