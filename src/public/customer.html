<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한국잠사박물관 | 입장권 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf8f5;--card:#fff;--border:#e8e2d9;
  --text:#2d2a26;--sub:#8a8478;--accent:#2e7d32;
  --accent2:#f57c00;--danger:#d32f2f;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --radius:16px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* 헤더 */
.header{background:linear-gradient(135deg,#2e7d32,#388e3c);color:#fff;
  padding:20px 16px;text-align:center;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;bottom:-20px;left:-10%;width:120%;height:40px;
  background:var(--bg);border-radius:50% 50% 0 0}
.header h1{font-size:20px;font-weight:800;letter-spacing:-0.5px;margin-bottom:2px}
.header p{font-size:12px;opacity:.85}
.header .leaf{position:absolute;font-size:40px;opacity:.12;top:8px;right:16px}

/* 메인 */
.main{flex:1;padding:16px;max-width:480px;margin:0 auto;width:100%}

/* 카드 */
.card{background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}

/* 입력 영역 */
.scan-area{position:relative}
.scan-area input{width:100%;padding:16px 56px 16px 16px;font-size:18px;font-weight:600;
  border:2px solid var(--border);border-radius:14px;outline:none;text-align:center;
  font-family:'Noto Sans KR',monospace;background:#fff;color:var(--text);transition:border .2s}
.scan-area input:focus{border-color:var(--accent)}
.scan-area input::placeholder{color:#c4bfb7;font-weight:400;font-size:15px}
.scan-btn{position:absolute;right:6px;top:6px;bottom:6px;padding:0 18px;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s}
.scan-btn:active{transform:scale(.96)}

/* 안내 텍스트 */
.hint{text-align:center;margin-top:12px;font-size:12px;color:var(--sub);line-height:1.6}
.hint b{color:var(--accent)}

/* 결과 영역 */
#result{transition:all .3s}

/* 티켓 카드 */
.ticket-card{border:2px solid var(--accent);border-radius:var(--radius);overflow:hidden;
  animation:slideUp .4s ease}
.ticket-header{background:var(--accent);color:#fff;padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center}
.ticket-header .name{font-size:20px;font-weight:800}
.ticket-header .badge{background:rgba(255,255,255,.25);padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:600}
.ticket-body{padding:20px;background:#fff}
.ticket-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ticket-info .item{background:#f5f3ef;border-radius:12px;padding:12px;text-align:center}
.ticket-info .item .label{font-size:11px;color:var(--sub);margin-bottom:4px}
.ticket-info .item .value{font-size:22px;font-weight:800}
.ticket-info .item .value.green{color:var(--accent)}
.ticket-info .item .value.blue{color:#1565c0}
.ticket-product{background:#f9f7f3;border-radius:10px;padding:12px;font-size:13px;
  color:var(--sub);margin-bottom:16px;text-align:center}

/* 사용처리 버튼 */
.use-btn{width:100%;padding:18px;border:none;border-radius:14px;font-size:17px;
  font-weight:800;cursor:pointer;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.use-btn.active{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;
  box-shadow:0 6px 20px rgba(46,125,50,.3)}
.use-btn.active:active{transform:scale(.97);box-shadow:0 3px 10px rgba(46,125,50,.2)}
.use-btn.disabled{background:#e0ddd8;color:#aaa;cursor:not-allowed}

/* 매수 선택 */
.qty-control{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;
  background:#f5f3ef;border-radius:12px;padding:10px}
.qty-control span{font-size:13px;color:var(--sub)}
.qty-control .qty-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text);font-weight:700;transition:background .15s}
.qty-control .qty-btn:active{background:#e8e2d9}
.qty-control .qty-val{font-size:24px;font-weight:800;min-width:40px;text-align:center;color:var(--accent)}

/* 완료 화면 */
.done-card{text-align:center;animation:scaleIn .5s ease}
.done-icon{font-size:64px;margin-bottom:12px}
.done-title{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px}
.done-sub{font-size:13px;color:var(--sub);margin-bottom:20px;line-height:1.6}
.done-info{display:flex;justify-content:center;gap:20px;margin-bottom:20px}
.done-info .item{text-align:center}
.done-info .item .label{font-size:11px;color:var(--sub)}
.done-info .item .value{font-size:18px;font-weight:800;color:var(--text)}
.another-btn{padding:14px;border:2px solid var(--border);border-radius:12px;background:#fff;
  width:100%;font-size:14px;font-weight:600;cursor:pointer;color:var(--sub);
  font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.another-btn:active{background:#f5f3ef}

/* 사용완료 */
.used-card{border-color:var(--accent2)}
.used-header{background:var(--accent2)}

/* 에러 */
.error-card{text-align:center;animation:shake .4s}
.error-icon{font-size:48px;margin-bottom:8px}
.error-text{font-size:14px;color:var(--danger);font-weight:600;margin-bottom:4px}
.error-sub{font-size:12px;color:var(--sub)}

/* 로딩 */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:30px;
  font-size:14px;color:var(--sub)}
.spinner{width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .6s linear infinite}

/* 푸터 */
.footer{text-align:center;padding:16px;font-size:11px;color:var(--sub);
  border-top:1px solid var(--border);margin-top:auto}
.footer a{color:var(--accent);text-decoration:none;font-weight:600}

/* 토스트 */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  padding:12px 24px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;
  z-index:999;animation:toastIn .3s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.success{background:var(--accent)}
.toast.error{background:var(--danger)}
.toast.info{background:#1565c0}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* QR 스캐너 */
.qr-btn{display:block;width:100%;padding:16px;margin-bottom:12px;
  background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .15s;
  box-shadow:0 4px 16px rgba(46,125,50,.3)}
.qr-btn:active{transform:scale(.97)}
.qr-btn.scanning{background:linear-gradient(135deg,#d32f2f,#e53935);
  box-shadow:0 4px 16px rgba(211,47,47,.3)}
#qrScanArea{display:none;margin-bottom:12px;border-radius:14px;overflow:hidden;
  border:2px solid var(--accent);background:#000;position:relative}
#qrScanArea video{width:100%;display:block}
#qrReader{width:100%;min-height:250px}
.qr-status{text-align:center;padding:10px;font-size:13px;color:#fff;
  background:rgba(0,0,0,.7);font-weight:600}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="header">
  <span class="leaf">🌿</span>
  <h1>🎫 한국잠사박물관</h1>
  <p>입장권 확인 · 사용처리</p>
</div>

<div class="main">
  <!-- QR 카메라 스캔 -->
  <button class="qr-btn" id="qrBtn" onclick="toggleQR()">📷 QR코드 카메라 스캔</button>
  <div id="qrScanArea">
    <div id="qrReader"></div>
    <div id="qrStatus" class="qr-status">카메라를 QR코드에 비춰주세요</div>
  </div>
  
  <!-- 수동 입력 -->
  <div class="card scan-area">
    <input id="codeInput" type="text" inputmode="text" placeholder="쿠폰번호 · 예매번호 · 전화 뒷4자리"
      autocomplete="off">
    <button class="scan-btn" onclick="doSearch()">확인</button>
  </div>
  <div class="hint">
    📷 위 버튼으로 <b>QR코드 스캔</b> 또는<br>
    <b>쿠폰번호</b>, <b>예매번호</b>, 전화번호 <b>뒷 4자리</b> 입력
  </div>

  <!-- 결과 -->
  <div id="result" style="margin-top:16px"></div>
</div>

<div class="footer">
  한국잠사박물관 · 충북 청주시 흥덕구 강내면 청주역로 213-52<br>
  ☎ 043-235-1267 · <a href="/admin">관리자</a>
</div>

<script>
var currentTicket = null;
var useQty = 0;
var qrScanning = false;
var qrScannerObj = null;

// ═══ QR 카메라 스캐너 ═══
function toggleQR() {
  if (qrScanning) { stopQR(); return; }
  startQR();
}

function startQR() {
  var scanArea = document.getElementById('qrScanArea');
  var btn = document.getElementById('qrBtn');
  var statusEl = document.getElementById('qrStatus');
  
  scanArea.style.display = 'block';
  btn.textContent = '⏹ 카메라 중지';
  btn.classList.add('scanning');
  statusEl.textContent = '카메라 시작 중...';
  qrScanning = true;
  
  // html5-qrcode 라이브러리 확인
  if (typeof Html5Qrcode === 'undefined') {
    statusEl.textContent = '❌ QR 라이브러리 로드 실패. 새로고침 해주세요.';
    return;
  }
  
  try {
    qrScannerObj = new Html5Qrcode("qrReader");
    
    var config = {
      fps: 10,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        var sz = Math.min(viewfinderWidth, viewfinderHeight) * 0.7;
        return { width: Math.floor(sz), height: Math.floor(sz) };
      },
      aspectRatio: 1.0,
      showTorchButtonIfSupported: true,
    };
    
    qrScannerObj.start(
      { facingMode: "environment" },
      config,
      function onScanSuccess(decodedText) {
        // QR 인식 성공!
        statusEl.textContent = '✅ QR 인식 완료!';
        statusEl.style.background = 'rgba(46,125,50,.9)';
        
        // 진동 피드백
        try { navigator.vibrate([100, 50, 100]); } catch(e) {}
        
        // QR URL에서 코드 추출
        var code = decodedText;
        var qrMatch = code.match(/qr\/([^\/\?\&]+)/);
        if (qrMatch) code = qrMatch[1];
        // ticket/find 파라미터
        var ticketMatch = code.match(/code=([^&]+)/);
        if (ticketMatch) code = ticketMatch[1];
        
        // 입력란에 세팅
        document.getElementById('codeInput').value = code;
        
        // 스캐너 정지 후 자동 검색
        stopQR();
        setTimeout(function() { doSearch(); }, 500);
      },
      function onScanFailure(errorMessage) {
        // 인식 실패 (계속 스캔 중) - 무시
      }
    ).then(function() {
      statusEl.textContent = '📷 QR코드를 카메라에 비춰주세요';
      statusEl.style.background = 'rgba(0,0,0,.7)';
    }).catch(function(err) {
      var errMsg = String(err);
      if (errMsg.indexOf('NotAllowed') >= 0 || errMsg.indexOf('Permission') >= 0) {
        statusEl.textContent = '❌ 카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해주세요.';
      } else if (errMsg.indexOf('NotFound') >= 0) {
        statusEl.textContent = '❌ 카메라를 찾을 수 없습니다.';
      } else {
        statusEl.textContent = '❌ 카메라 오류: ' + errMsg.substring(0, 80);
      }
      console.error('QR 시작 오류:', err);
    });
  } catch(e) {
    statusEl.textContent = '❌ QR 초기화 실패: ' + e.message;
    console.error(e);
  }
}

function stopQR() {
  var scanArea = document.getElementById('qrScanArea');
  var btn = document.getElementById('qrBtn');
  
  if (qrScannerObj) {
    try { qrScannerObj.stop().catch(function(){}); } catch(e) {}
    qrScannerObj = null;
  }
  
  scanArea.style.display = 'none';
  btn.textContent = '📷 QR코드 카메라 스캔';
  btn.classList.remove('scanning');
  qrScanning = false;
}

var inp = document.getElementById('codeInput');
inp.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  var code = inp.value.trim();
  if (!code) { showToast('코드를 입력해주세요', 'info'); inp.focus(); return; }
  
  // QR URL 처리
  var qrMatch = code.match(/qr\/([^\/\?]+)/);
  if (qrMatch) code = qrMatch[1];
  
  showLoading();
  
  try {
    var r = await fetch('/api/ticket/find?code=' + encodeURIComponent(code));
    var d = await r.json();
    
    if (d.ok) {
      if (d.multiple && d.tickets && d.tickets.length > 1) {
        // 다건 결과 (전화번호 검색)
        showMultiple(d.tickets);
      } else {
        var tk = d.ticket || (d.tickets && d.tickets[0]);
        currentTicket = tk;
        useQty = tk.qty || 1;
        showTicket(tk);
      }
    } else {
      showError(d.error || '유효하지 않은 코드입니다');
    }
  } catch(e) {
    showError('서버 연결에 실패했습니다');
  }
  inp.value = '';
}

function showMultiple(tickets) {
  var el = document.getElementById('result');
  var h = '<div class="card" style="animation:slideUp .4s">';
  h += '<div style="font-size:15px;font-weight:800;color:var(--accent);margin-bottom:12px;text-align:center">' + tickets.length + '건의 입장권이 있습니다</div>';
  h += '<div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:16px">사용하실 입장권을 선택해주세요</div>';
  tickets.forEach(function(tk) {
    h += '<button onclick=\'pickTicket(' + JSON.stringify(tk).replace(/'/g, "\\u0027") + ')\' style="width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;font-family:inherit;transition:border .15s">';
    h += '<div><div style="font-size:15px;font-weight:700;color:var(--text)">' + tk.buyer + '</div>';
    h += '<div style="font-size:12px;color:var(--sub);margin-top:2px">' + (tk.product || '입장권') + '</div></div>';
    h += '<div style="text-align:right"><div style="font-size:16px;font-weight:800;color:var(--accent)">' + tk.qty + '매</div>';
    h += '<div style="font-size:11px;color:var(--sub)">₩' + (tk.price || 0).toLocaleString() + '</div></div>';
    h += '</button>';
  });
  h += '<button class="another-btn" onclick="resetView()">돌아가기</button>';
  h += '</div>';
  el.innerHTML = h;
}

function pickTicket(tk) {
  currentTicket = tk;
  useQty = tk.qty || 1;
  showTicket(tk);
}

function showLoading() {
  document.getElementById('result').innerHTML =
    '<div class="card loading"><div class="spinner"></div>조회 중...</div>';
}

function showTicket(tk) {
  var isUsable = tk.status === '사용가능' || tk.status === '확정';
  var el = document.getElementById('result');
  
  if (isUsable) {
    var h = '<div class="ticket-card">';
    h += '<div class="ticket-header"><span class="name">' + tk.buyer + '</span>';
    h += '<span class="badge">' + (tk.source === 'naver' ? '네이버' : tk.source === 'la2fdoci' ? '라이프도시' : '직접') + '</span></div>';
    h += '<div class="ticket-body">';
    h += '<div class="ticket-info">';
    h += '<div class="item"><div class="label">매수</div><div class="value blue">' + tk.qty + '매</div></div>';
    h += '<div class="item"><div class="label">금액</div><div class="value green">₩' + (tk.price || 0).toLocaleString() + '</div></div>';
    h += '</div>';
    if (tk.product) {
      h += '<div class="ticket-product">📦 ' + tk.product + '</div>';
    }
    // 매수 2 이상이면 분할 선택
    if (tk.qty > 1) {
      h += '<div class="qty-control">';
      h += '<span>사용 매수</span>';
      h += '<button class="qty-btn" onclick="changeQty(-1)">−</button>';
      h += '<span class="qty-val" id="qtyDisplay">' + tk.qty + '</span>';
      h += '<button class="qty-btn" onclick="changeQty(1)">+</button>';
      h += '<span>/ ' + tk.qty + '매</span>';
      h += '</div>';
    }
    h += '<button class="use-btn active" onclick="doUse()">✓ 사용처리</button>';
    h += '</div></div>';
    el.innerHTML = h;
  } else {
    // 이미 사용된 티켓
    var h = '<div class="ticket-card used-card">';
    h += '<div class="ticket-header used-header"><span class="name">' + tk.buyer + '</span>';
    h += '<span class="badge">사용완료</span></div>';
    h += '<div class="ticket-body">';
    h += '<div class="ticket-info">';
    h += '<div class="item"><div class="label">매수</div><div class="value">' + tk.qty + '매</div></div>';
    h += '<div class="item"><div class="label">금액</div><div class="value">₩' + (tk.price || 0).toLocaleString() + '</div></div>';
    h += '</div>';
    if (tk.product) h += '<div class="ticket-product">📦 ' + tk.product + '</div>';
    h += '<div style="text-align:center;padding:10px;color:#f57c00;font-weight:700;font-size:15px">⚠️ 이미 사용된 입장권입니다</div>';
    if (tk.usedAt) h += '<div style="text-align:center;font-size:12px;color:#8a8478">사용일시: ' + new Date(tk.usedAt).toLocaleString('ko-KR') + '</div>';
    h += '<button class="another-btn" onclick="resetView()" style="margin-top:16px">다른 입장권 확인</button>';
    h += '</div></div>';
    el.innerHTML = h;
  }
}

function changeQty(delta) {
  if (!currentTicket) return;
  var max = currentTicket.qty || 1;
  useQty = Math.max(1, Math.min(max, useQty + delta));
  var display = document.getElementById('qtyDisplay');
  if (display) display.textContent = useQty;
}

async function doUse() {
  if (!currentTicket) return;
  
  // 확인 다이얼로그
  var msg = currentTicket.buyer + '님 입장권 ';
  if (currentTicket.qty > 1) msg += useQty + '/' + currentTicket.qty + '매 ';
  msg += '사용처리 하시겠습니까?';
  if (!confirm(msg)) return;
  
  showLoading();
  
  try {
    var body = { ticketId: currentTicket.id };
    if (currentTicket.qty > 1) body.useQty = useQty;
    
    var r = await fetch('/api/ticket/use', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var d = await r.json();
    
    if (d.ok) {
      showDone(d.ticket, d.split);
      showToast('사용처리 완료!', 'success');
    } else {
      showError(d.error || '처리에 실패했습니다');
    }
  } catch(e) {
    showError('서버 연결에 실패했습니다');
  }
}

function showDone(ticket, isSplit) {
  var el = document.getElementById('result');
  var h = '<div class="card done-card">';
  h += '<div class="done-icon">✅</div>';
  h += '<div class="done-title">사용처리 완료!</div>';
  h += '<div class="done-sub">' + ticket.buyer + '님 즐거운 관람 되세요 🌿</div>';
  h += '<div class="done-info">';
  h += '<div class="item"><div class="label">구매자</div><div class="value">' + ticket.buyer + '</div></div>';
  h += '<div class="item"><div class="label">상품</div><div class="value" style="font-size:13px">' + (ticket.product || '입장권').substring(0, 10) + '</div></div>';
  h += '</div>';
  if (isSplit) {
    h += '<div style="font-size:12px;color:#f57c00;margin-bottom:12px;background:#fff8f0;padding:8px;border-radius:8px">분할 사용: ' + useQty + '매 처리 / 나머지 ' + ((currentTicket.qty || 1) - useQty) + '매 남음</div>';
  }
  h += '<button class="another-btn" onclick="resetView()">다른 입장권 확인</button>';
  h += '</div>';
  el.innerHTML = h;
  currentTicket = null;
}

function showError(msg) {
  var el = document.getElementById('result');
  el.innerHTML = '<div class="card error-card">'
    + '<div class="error-icon">😔</div>'
    + '<div class="error-text">' + msg + '</div>'
    + '<div class="error-sub">코드를 다시 확인해주세요</div>'
    + '<button class="another-btn" onclick="resetView()" style="margin-top:16px">다시 시도</button>'
    + '</div>';
}

function resetView() {
  document.getElementById('result').innerHTML = '';
  currentTicket = null;
  useQty = 0;
  stopQR();
  inp.value = '';
  inp.focus();
}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}
</script>
</body>
</html>
